<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRADIFOOT — Scanner Zoning</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif']
          }
        }
      }
    };
  </script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    #reader {
      border: 1px solid #e5e7eb !important;
      border-radius: 0.75rem;
      background-color: #f9fafb;
      color: #1e293b;
      overflow: hidden;
    }
    #reader img {
      display: inline-block;
    }
    #reader__dashboard_section_csr button,
    #reader__dashboard_section_fsr button,
    #reader button {
      background-color: #2563eb !important;
      color: #ffffff !important;
      border: none !important;
      border-radius: 9999px !important;
      padding: 0.6rem 1.25rem !important;
      font-weight: 700 !important;
      font-size: 0.875rem !important;
      cursor: pointer !important;
      margin: 0.35rem 0.25rem !important;
      touch-action: manipulation;
    }
    #reader__dashboard_section_csr button:hover,
    #reader__dashboard_section_fsr button:hover,
    #reader button:hover {
      background-color: #1d4ed8 !important;
    }
    #reader select {
      background-color: #ffffff !important;
      color: #1e293b !important;
      border: 1px solid #d1d5db !important;
      border-radius: 0.75rem !important;
      padding: 0.5rem 0.75rem !important;
      font-size: 0.875rem !important;
      max-width: 100%;
    }
    #reader a {
      color: #2563eb !important;
      text-decoration: underline !important;
    }
    #reader__scan_region video {
      border-radius: 0.5rem;
      object-fit: cover;
    }
    @keyframes scanFlash {
      0% { transform: scale(0.99); }
      50% { transform: scale(1.01); }
      100% { transform: scale(1); }
    }
    .animate-scan-flash {
      animation: scanFlash 200ms ease-out;
    }
    @keyframes shrinkBar {
      from { width: 100%; }
      to { width: 0%; }
    }
    .animate-countdown {
      animation: shrinkBar 3000ms linear forwards;
    }
  </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex items-center justify-center p-4 antialiased">

  <main class="w-full max-w-md mx-auto flex flex-col gap-4">

    <!-- Ultra-Minimalist Scanner Card -->
    <section
      aria-label="TRADIFOOT Scanner Zoning"
      class="relative bg-white border border-gray-200 rounded-2xl shadow-sm p-6 sm:p-8 flex flex-col"
    >
      <!-- Top-Right Micro-Status Indicator -->
      <div
        id="db-status"
        role="status"
        aria-live="polite"
        title="Initialisation..."
        class="absolute top-4 right-4 flex items-center justify-center"
      >
        <span class="relative flex items-center justify-center w-5 h-5">
          <svg class="animate-spin w-4 h-4 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" aria-hidden="true">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          <span class="absolute w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
        </span>
      </div>

      <!-- Brand Injection -->
      <header class="pt-1">
        <img
          id="brand-logo"
          src="./logo.png"
          alt="TRADIFOOT"
          class="h-8 mx-auto mb-6 object-contain"
          onerror="this.classList.add('hidden'); document.getElementById('brand-fallback').classList.remove('hidden');"
        />
        <h1
          id="brand-fallback"
          class="hidden text-2xl font-black text-slate-800 tracking-tighter text-center mb-6"
        >
          TRADIFOOT
        </h1>
      </header>

      <!-- Ultra-Clean Scan Result Display -->
      <div
        id="result-panel"
        aria-live="polite"
        class="relative py-8 sm:py-10 min-h-[168px] flex flex-col items-center justify-center text-center"
      >
        <!-- Idle State -->
        <div id="state-idle" class="flex items-center justify-center text-slate-200">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 7V5a1 1 0 011-1h2M17 4h2a1 1 0 011 1v2M4 17v2a1 1 0 001 1h2M17 20h2a1 1 0 001-1v-2M7 8v8M10 8v8M13 8v8M17 8v8" />
          </svg>
        </div>

        <!-- Success State -->
        <div id="state-success" class="hidden flex flex-col items-center justify-center">
          <p id="result-zone" class="text-7xl font-black text-slate-900 tracking-tighter leading-none break-words"></p>
          <p id="result-sku" class="text-lg font-medium text-slate-400 mt-3 break-all"></p>
        </div>

        <!-- Found Without Zone -->
        <div id="state-nozone" class="hidden flex flex-col items-center justify-center">
          <p class="text-5xl sm:text-6xl font-black text-red-600 tracking-tighter leading-none">NO ZONE</p>
          <p id="nozone-sku" class="text-lg font-medium text-slate-400 mt-3 break-all"></p>
        </div>

        <!-- Not Found -->
        <div id="state-error" class="hidden flex flex-col items-center justify-center">
          <p class="text-6xl font-black text-red-600 tracking-tighter leading-none">INCONNU</p>
        </div>

        <!-- Auto-Clear Countdown Hairline -->
        <div id="countdown-track" class="hidden absolute bottom-2 left-8 right-8 h-0.5 bg-slate-100 rounded-full overflow-hidden">
          <div id="countdown-bar" class="h-full bg-green-500"></div>
        </div>
      </div>

      <!-- Minimalist Pill Input (SKU Typing + Auto-Focused USB Douchette) -->
      <form id="manual-scan-form" autocomplete="off" class="relative mt-2">
        <input
          id="barcode-input"
          name="barcode"
          type="text"
          inputmode="text"
          enterkeyhint="search"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          disabled
          placeholder="SKU ou code-barres..."
          aria-label="Saisir SKU ou scanner code-barres"
          class="w-full h-11 bg-slate-50 border border-gray-200 focus:border-blue-500 focus:bg-white focus:outline-none rounded-full pl-5 pr-12 text-center text-sm font-medium text-slate-800 placeholder-slate-400 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        />
        <button
          id="submit-scan-btn"
          type="submit"
          disabled
          aria-label="Rechercher SKU"
          class="absolute right-1.5 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-slate-200/80 hover:bg-blue-600 text-slate-600 hover:text-white flex items-center justify-center transition-colors touch-manipulation disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-slate-200/80 disabled:hover:text-slate-600"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </button>
      </form>

      <!-- Refined Pill-Shaped Camera Button -->
      <button
        id="camera-toggle-btn"
        type="button"
        disabled
        class="mt-3 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-6 rounded-full flex items-center justify-center gap-2.5 transition-colors touch-manipulation disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-blue-600"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h2l1.5-2h7L17 7h2a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
          <circle cx="12" cy="13" r="3.5" />
        </svg>
        <span id="camera-btn-label">Scanner</span>
      </button>
    </section>

    <!-- Camera Viewport Card -->
    <section
      id="camera-section"
      aria-label="Caméra"
      class="hidden bg-white border border-gray-200 rounded-2xl shadow-sm p-4"
    >
      <div id="reader" class="w-full"></div>
      <p id="camera-error" class="hidden mt-3 text-center text-xs font-medium text-red-600"></p>
    </section>

  </main>

  <script>
    (() => {
      "use strict";

      /**
       * =========================================================================
       * 1. AUTOMATED EXCEL FETCH & SHEETJS PARSER
       * =========================================================================
       */
      const EXCEL_CANDIDATE_PATHS = [
        "./zoning.xlsx",
        "./Zonning%20Smail%20Platforme.xlsx"
      ];
      let barcodeMap = new Map();
      let skuMap = new Map();

      function extractCellAsString(cell) {
        if (!cell) return "";
        if (cell.t === "e") return "";

        if (cell.t === "s" || cell.t === "str") {
          return String(cell.v ?? "").trim();
        }

        if (cell.t === "n") {
          const num = cell.v;
          if (typeof num !== "number" || !Number.isFinite(num)) {
            return String(cell.w ?? cell.v ?? "").trim();
          }

          const formatted = typeof cell.w === "string" ? cell.w.trim() : "";
          if (/^\d+$/.test(formatted) && Number(formatted) === num) {
            return formatted;
          }

          if (Math.abs(num) < 1e20) {
            return Number.isInteger(num)
              ? num.toFixed(0).trim()
              : String(num).trim();
          }

          return num.toLocaleString("fullwide", { useGrouping: false }).trim();
        }

        return String(cell.w ?? cell.v ?? "").trim();
      }

      function normalizeHeaderName(name) {
        return String(name ?? "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase()
          .replace(/[^a-z0-9]/g, "");
      }

      function isValidZoneValue(zone) {
        const clean = String(zone ?? "").trim();
        return clean.length > 0 && clean.toUpperCase() !== "NO ZONE";
      }

      function detectColumns(sheet, range, { requireBarcode = true } = {}) {
        const headerRow = range.s.r;
        const headers = [];

        for (let c = range.s.c; c <= range.e.c; c++) {
          const cell = sheet[XLSX.utils.encode_cell({ r: headerRow, c })];
          headers.push({
            colIndex: c,
            raw: extractCellAsString(cell),
            norm: normalizeHeaderName(extractCellAsString(cell))
          });
        }

        let barcodeCol = -1;
        let skuCol = -1;
        let zoneCol = -1;

        for (const h of headers) {
          if (
            barcodeCol === -1 &&
            (h.norm.includes("barre") ||
              h.norm.includes("barcode") ||
              h.norm === "ean" ||
              h.norm === "upc" ||
              h.norm === "gtin" ||
              h.norm === "cb")
          ) {
            barcodeCol = h.colIndex;
          } else if (
            skuCol === -1 &&
            (h.norm.includes("sku") ||
              h.norm.includes("article") ||
              h.norm === "ref" ||
              h.norm.includes("reference"))
          ) {
            skuCol = h.colIndex;
          } else if (
            zoneCol === -1 &&
            (h.norm.includes("zone") ||
              h.norm.includes("formule") ||
              h.norm === "bin" ||
              h.norm.includes("emplacement") ||
              h.norm.includes("location"))
          ) {
            zoneCol = h.colIndex;
          }
        }

        if (requireBarcode && barcodeCol === -1 && headers.length >= 2) {
          let bestCol = range.s.c;
          let bestScore = -1;
          const sampleEnd = Math.min(range.e.r, headerRow + 15);
          for (let c = range.s.c; c <= range.e.c; c++) {
            let score = 0;
            for (let r = headerRow + 1; r <= sampleEnd; r++) {
              const val = extractCellAsString(sheet[XLSX.utils.encode_cell({ r, c })]);
              if (/^\d{8,14}$/.test(val)) score++;
            }
            if (score > bestScore) {
              bestScore = score;
              bestCol = c;
            }
          }
          if (bestScore > 0) {
            barcodeCol = bestCol;
          }
        }

        const remainingCols = headers
          .map((h) => h.colIndex)
          .filter((c) => c !== barcodeCol && c !== skuCol && c !== zoneCol);

        if (skuCol === -1 && remainingCols.length > 0) {
          skuCol = remainingCols.shift();
        }
        if (zoneCol === -1 && remainingCols.length > 0) {
          zoneCol = remainingCols.shift();
        }

        return { barcodeCol, skuCol, zoneCol };
      }

      function upsertLookupEntry(targetMap, key, entry) {
        if (!key) return;
        const existing = targetMap.get(key);
        if (!existing) {
          targetMap.set(key, entry);
          return;
        }
        const existingHasZone = isValidZoneValue(existing.zone);
        const currentHasZone = isValidZoneValue(entry.zone);
        if (!existingHasZone && currentHasZone) {
          targetMap.set(key, {
            sku: entry.sku || existing.sku,
            zone: entry.zone,
            barcode: entry.barcode || existing.barcode
          });
        } else {
          if (!existing.sku && entry.sku) existing.sku = entry.sku;
          if (!existing.barcode && entry.barcode) existing.barcode = entry.barcode;
        }
      }

      function parseExcelWorkbook(arrayBuffer, sourceLabel = "Excel") {
        if (typeof XLSX === "undefined") {
          throw new Error("SheetJS indisponible.");
        }

        const workbook = XLSX.read(arrayBuffer, { type: "array" });
        if (!workbook.SheetNames || workbook.SheetNames.length === 0) {
          throw new Error(`${sourceLabel} vide.`);
        }

        const bMap = new Map();
        const sMap = new Map();

        for (let sIdx = 0; sIdx < workbook.SheetNames.length; sIdx++) {
          const sheetName = workbook.SheetNames[sIdx];
          const sheet = workbook.Sheets[sheetName];
          if (!sheet || !sheet["!ref"]) continue;

          const range = XLSX.utils.decode_range(sheet["!ref"]);
          const cols = detectColumns(sheet, range, { requireBarcode: sIdx === 0 });

          if (cols.barcodeCol === -1 && cols.skuCol === -1) {
            if (sIdx === 0) {
              throw new Error(`Colonnes introuvables dans ${sourceLabel}.`);
            }
            continue;
          }

          for (let r = range.s.r + 1; r <= range.e.r; r++) {
            const barcode =
              cols.barcodeCol !== -1
                ? extractCellAsString(sheet[XLSX.utils.encode_cell({ r, c: cols.barcodeCol })])
                : "";
            const sku =
              cols.skuCol !== -1
                ? extractCellAsString(sheet[XLSX.utils.encode_cell({ r, c: cols.skuCol })])
                : "";
            const zone =
              cols.zoneCol !== -1
                ? extractCellAsString(sheet[XLSX.utils.encode_cell({ r, c: cols.zoneCol })])
                : "";

            if (!barcode && !sku) continue;

            if (barcode) {
              upsertLookupEntry(bMap, barcode, { sku, zone, barcode });
            }
            if (sku) {
              upsertLookupEntry(sMap, sku.toLowerCase(), { sku, zone, barcode });
            }
          }
        }

        if (bMap.size === 0 && sMap.size === 0) {
          throw new Error(`Aucune donnée dans ${sourceLabel}.`);
        }

        return {
          barcodeMap: bMap,
          skuMap: sMap,
          uniqueBarcodes: bMap.size,
          uniqueSkus: sMap.size
        };
      }

      /**
       * =========================================================================
       * 2. AUDIO FEEDBACK ENGINE (Synthesized Web Audio API)
       * =========================================================================
       */
      const AudioFeedback = (() => {
        let ctx = null;

        function ensureContext() {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return null;
          if (!ctx) ctx = new AudioCtx();
          if (ctx.state === "suspended") ctx.resume().catch(() => {});
          return ctx;
        }

        function playTone(freq, startOffset, duration, type, volume) {
          const audioCtx = ensureContext();
          if (!audioCtx) return;

          const now = audioCtx.currentTime + startOffset;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.exponentialRampToValueAtTime(volume, now + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(now);
          osc.stop(now + duration + 0.015);
        }

        return {
          unlock() {
            try { ensureContext(); } catch (_) {}
          },
          playSuccess() {
            try {
              playTone(987.77, 0.0, 0.075, "sine", 0.25);
              playTone(1318.51, 0.075, 0.11, "sine", 0.28);
              if (navigator.vibrate) navigator.vibrate(70);
            } catch (_) {}
          },
          playError() {
            try {
              playTone(155, 0.0, 0.12, "sawtooth", 0.22);
              playTone(125, 0.15, 0.18, "sawtooth", 0.22);
              if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
            } catch (_) {}
          }
        };
      })();

      /**
       * =========================================================================
       * 3. DEBOUNCE, DOM REFERENCES & STATE
       * =========================================================================
       */
      function debounce(fn, delayMs) {
        let timerId = null;
        const debounced = function (...args) {
          if (timerId !== null) clearTimeout(timerId);
          timerId = setTimeout(() => {
            timerId = null;
            fn.apply(this, args);
          }, delayMs);
        };
        debounced.cancel = () => {
          if (timerId !== null) {
            clearTimeout(timerId);
            timerId = null;
          }
        };
        return debounced;
      }

      const brandLogo = document.getElementById("brand-logo");
      const brandFallback = document.getElementById("brand-fallback");
      const dbStatusEl = document.getElementById("db-status");
      const barcodeInput = document.getElementById("barcode-input");
      const submitScanBtn = document.getElementById("submit-scan-btn");
      const manualScanForm = document.getElementById("manual-scan-form");
      const cameraToggleBtn = document.getElementById("camera-toggle-btn");
      const cameraBtnLabel = document.getElementById("camera-btn-label");
      const cameraSection = document.getElementById("camera-section");
      const cameraErrorEl = document.getElementById("camera-error");
      const readerEl = document.getElementById("reader");

      const resultPanel = document.getElementById("result-panel");
      const stateIdle = document.getElementById("state-idle");
      const stateSuccess = document.getElementById("state-success");
      const stateNoZone = document.getElementById("state-nozone");
      const stateError = document.getElementById("state-error");
      const resultZoneEl = document.getElementById("result-zone");
      const resultSkuEl = document.getElementById("result-sku");
      const noZoneSkuEl = document.getElementById("nozone-sku");
      const countdownTrack = document.getElementById("countdown-track");
      const countdownBar = document.getElementById("countdown-bar");

      const state = {
        isLoaded: false,
        hasLoadError: false,
        isCameraActive: false,
        isCameraBusy: false,
        html5QrcodeScanner: null,
        autoClearTimer: null,
        lastScanCode: "",
        lastScanAt: 0,
        lastKeyTime: 0,
        rapidBurstCount: 0
      };

      const AUTO_CLEAR_MS = 3000;
      const USB_DEBOUNCE_MS = 160;
      const USB_DUPLICATE_COOLDOWN_MS = 350;
      const CAMERA_DUPLICATE_COOLDOWN_MS = 1800;

      /**
       * =========================================================================
       * 4. MICRO-STATUS DOTS & HYBRID FOCUS CONTROL
       * =========================================================================
       */
      function isDesktopPointer() {
        return typeof window.matchMedia !== "function" || window.matchMedia("(pointer: fine)").matches;
      }

      function setInputsDisabled(disabled) {
        barcodeInput.disabled = disabled;
        submitScanBtn.disabled = disabled;
        cameraToggleBtn.disabled = disabled;
      }

      function renderDbStatusLoading() {
        state.isLoaded = false;
        state.hasLoadError = false;
        setInputsDisabled(true);

        dbStatusEl.title = "Chargement...";
        dbStatusEl.innerHTML = `
          <span class="relative flex items-center justify-center w-5 h-5">
            <svg class="animate-spin w-4 h-4 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" aria-hidden="true">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            <span class="absolute w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
          </span>
        `;
      }

      function renderDbStatusReady(articleCount) {
        state.isLoaded = true;
        state.hasLoadError = false;
        setInputsDisabled(false);

        dbStatusEl.title = `Prêt (${articleCount.toLocaleString("fr-FR")})`;
        dbStatusEl.innerHTML = `<span class="block w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse"></span>`;
        focusScannerInput();
      }

      function renderDbStatusError(message) {
        state.isLoaded = false;
        state.hasLoadError = true;
        setInputsDisabled(true);

        dbStatusEl.title = `${message} — Cliquer pour réessayer`;
        dbStatusEl.innerHTML = "";
        const retryDot = document.createElement("button");
        retryDot.type = "button";
        retryDot.className = "block w-3 h-3 rounded-full bg-red-500 animate-pulse cursor-pointer focus:outline-none";
        retryDot.setAttribute("aria-label", "Réessayer le chargement");
        retryDot.addEventListener("click", () => {
          AudioFeedback.unlock();
          loadZoningDatabase();
        });
        dbStatusEl.appendChild(retryDot);
      }

      function focusScannerInput(force = false) {
        if (!state.isLoaded || state.isCameraActive) return;
        if (!force && !isDesktopPointer()) return;
        requestAnimationFrame(() => {
          if (state.isLoaded && !state.isCameraActive && document.activeElement !== barcodeInput) {
            barcodeInput.focus({ preventScroll: true });
          }
        });
      }

      function updateCameraButtonUI() {
        if (state.isCameraActive) {
          cameraToggleBtn.className = "mt-3 w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3.5 px-6 rounded-full flex items-center justify-center gap-2.5 transition-colors touch-manipulation disabled:opacity-40 disabled:cursor-not-allowed";
          cameraBtnLabel.textContent = "Fermer";
        } else {
          cameraToggleBtn.className = "mt-3 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-6 rounded-full flex items-center justify-center gap-2.5 transition-colors touch-manipulation disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-blue-600";
          cameraBtnLabel.textContent = "Scanner";
        }
      }

      function clearAutoResetTimer() {
        if (state.autoClearTimer !== null) {
          clearTimeout(state.autoClearTimer);
          state.autoClearTimer = null;
        }
      }

      function resetToIdleState() {
        clearAutoResetTimer();
        stateSuccess.classList.add("hidden");
        stateNoZone.classList.add("hidden");
        stateError.classList.add("hidden");
        countdownTrack.classList.add("hidden");
        countdownBar.classList.remove("animate-countdown");
        stateIdle.classList.remove("hidden");
      }

      function scheduleAutoClear() {
        clearAutoResetTimer();
        countdownTrack.classList.remove("hidden");
        countdownBar.classList.remove("animate-countdown");
        void countdownBar.offsetWidth;
        countdownBar.classList.add("animate-countdown");

        state.autoClearTimer = setTimeout(() => {
          state.autoClearTimer = null;
          resetToIdleState();
          if (!state.isCameraActive) {
            focusScannerInput();
          }
        }, AUTO_CLEAR_MS);
      }

      function triggerFlashAnimation() {
        resultPanel.classList.remove("animate-scan-flash");
        void resultPanel.offsetWidth;
        resultPanel.classList.add("animate-scan-flash");
      }

      /**
       * =========================================================================
       * 5. AUTOMATED FETCH WITH CACHE-BUSTING
       * =========================================================================
       */
      async function loadZoningDatabase() {
        renderDbStatusLoading();

        try {
          if (window.location.protocol === "file:") {
            throw new Error("HTTP/HTTPS requis");
          }

          let lastHttpStatus = null;
          let matchedPath = null;
          let data = null;

          for (const candidatePath of EXCEL_CANDIDATE_PATHS) {
            const cacheBustedUrl = `${candidatePath}?v=${new Date().getTime()}`;
            const response = await fetch(cacheBustedUrl, { cache: "no-store" });

            if (response.ok) {
              matchedPath = candidatePath;
              data = await response.arrayBuffer();
              break;
            }
            lastHttpStatus = response.status;
          }

          if (!data || !matchedPath) {
            throw new Error(`HTTP ${lastHttpStatus ?? "erreur"}`);
          }

          await new Promise((resolve) => setTimeout(resolve, 16));

          const sourceLabel = decodeURIComponent(matchedPath.replace("./", ""));
          const parsed = parseExcelWorkbook(data, sourceLabel);
          barcodeMap = parsed.barcodeMap;
          skuMap = parsed.skuMap;
          renderDbStatusReady(parsed.uniqueSkus || parsed.uniqueBarcodes);
        } catch (err) {
          console.error("Erreur chargement zoning:", err);
          barcodeMap = new Map();
          skuMap = new Map();
          renderDbStatusError(err?.message || "Erreur de chargement");
        }
      }

      /**
       * =========================================================================
       * 6. LOOKUP ENGINE (Barcode + Case-Insensitive SKU)
       * =========================================================================
       */
      function lookupItem(rawQuery) {
        const query = String(rawQuery ?? "").trim();
        if (!query) return null;

        let entry = barcodeMap.get(query);
        let matchedBy = "barcode";

        if (!entry && query.length === 13 && query.startsWith("0")) {
          entry = barcodeMap.get(query.slice(1));
        } else if (!entry && query.length === 12) {
          entry = barcodeMap.get("0" + query);
        }

        if (!entry) {
          const skuEntry = skuMap.get(query.toLowerCase());
          if (skuEntry) {
            entry = skuEntry;
            matchedBy = "sku";
          }
        }

        return { query, matchedBy, entry: entry || null };
      }

      function handleBarcodeScan(rawBarcode, source = "usb") {
        if (!state.isLoaded) return;

        const code = String(rawBarcode ?? "").trim();
        if (!code) return;

        const now = Date.now();
        const cooldown = source === "camera" ? CAMERA_DUPLICATE_COOLDOWN_MS : USB_DUPLICATE_COOLDOWN_MS;

        if (code === state.lastScanCode && now - state.lastScanAt < cooldown) {
          if (source !== "camera") {
            barcodeInput.value = "";
            if (source === "usb" || isDesktopPointer()) {
              focusScannerInput();
            }
          }
          return;
        }

        state.lastScanCode = code;
        state.lastScanAt = now;
        state.rapidBurstCount = 0;
        state.lastKeyTime = 0;

        if (source !== "camera") {
          barcodeInput.value = "";
        }

        clearAutoResetTimer();
        stateIdle.classList.add("hidden");
        stateSuccess.classList.add("hidden");
        stateNoZone.classList.add("hidden");
        stateError.classList.add("hidden");

        const result = lookupItem(code);

        if (!result || !result.entry) {
          stateError.classList.remove("hidden");
          countdownBar.className = "h-full bg-red-500";
          AudioFeedback.playError();
        } else {
          const { sku, zone } = result.entry;
          const cleanZone = String(zone ?? "").trim();
          const hasValidZone = cleanZone.length > 0 && cleanZone.toUpperCase() !== "NO ZONE";

          if (!hasValidZone) {
            noZoneSkuEl.textContent = sku || code;
            stateNoZone.classList.remove("hidden");
            countdownBar.className = "h-full bg-red-500";
            AudioFeedback.playError();
          } else {
            resultZoneEl.textContent = cleanZone;
            resultSkuEl.textContent = sku || "";
            resultSkuEl.classList.toggle("hidden", !sku);
            stateSuccess.classList.remove("hidden");
            countdownBar.className = "h-full bg-green-500";
            AudioFeedback.playSuccess();
          }
        }

        triggerFlashAnimation();
        scheduleAutoClear();

        if (!state.isCameraActive) {
          if (source === "manual" && !isDesktopPointer()) {
            barcodeInput.blur();
          } else {
            focusScannerInput();
          }
        }
      }

      /**
       * =========================================================================
       * 7. HYBRID INPUT LISTENERS (USB Douchette + Manual SKU + Camera)
       * =========================================================================
       */
      const debouncedUsbScannerSubmit = debounce((val) => {
        const trimmed = String(val ?? "").trim();
        if (trimmed.length >= 4) {
          handleBarcodeScan(trimmed, "usb");
        }
      }, USB_DEBOUNCE_MS);

      barcodeInput.addEventListener("keydown", (e) => {
        AudioFeedback.unlock();
        if (!state.isLoaded) return;

        if (e.isComposing || e.key === "Unidentified") {
          state.rapidBurstCount = 0;
          state.lastKeyTime = 0;
          return;
        }

        const now = performance.now();
        const delta = state.lastKeyTime > 0 ? now - state.lastKeyTime : 0;
        state.lastKeyTime = now;

        if (delta > 0 && delta < 35) {
          state.rapidBurstCount += 1;
        } else if (delta >= 80) {
          state.rapidBurstCount = 0;
        }

        if (e.key === "Enter") {
          e.preventDefault();
          debouncedUsbScannerSubmit.cancel();
          const source = state.rapidBurstCount >= 5 ? "usb" : "manual";
          handleBarcodeScan(barcodeInput.value, source);
        }
      });

      barcodeInput.addEventListener("input", () => {
        if (!state.isLoaded) return;

        const val = barcodeInput.value.trim();
        if (!val) {
          debouncedUsbScannerSubmit.cancel();
          return;
        }

        // Only auto-submit when sustained rapid HID scanner keystrokes occur (< 35ms each)
        if (state.rapidBurstCount >= 6) {
          debouncedUsbScannerSubmit(val);
        } else {
          debouncedUsbScannerSubmit.cancel();
        }
      });

      manualScanForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        AudioFeedback.unlock();
        if (!state.isLoaded) return;

        debouncedUsbScannerSubmit.cancel();
        if (state.isCameraActive) {
          await stopCamera();
        }
        handleBarcodeScan(barcodeInput.value, "manual");
      });

      barcodeInput.addEventListener("focus", () => {
        if (state.isCameraActive) stopCamera();
      });

      /**
       * =========================================================================
       * 8. CAMERA SCANNER (html5-qrcode)
       * =========================================================================
       */
      function stopDanglingVideoTracks() {
        readerEl.querySelectorAll("video").forEach((video) => {
          const stream = video.srcObject;
          if (stream && typeof stream.getTracks === "function") {
            stream.getTracks().forEach((track) => track.stop());
          }
          video.srcObject = null;
        });
      }

      async function startCamera() {
        if (!state.isLoaded || state.isCameraActive || state.isCameraBusy) return;
        state.isCameraBusy = true;
        cameraErrorEl.classList.add("hidden");
        cameraErrorEl.textContent = "";

        if (typeof Html5QrcodeScanner === "undefined") {
          cameraSection.classList.remove("hidden");
          cameraErrorEl.textContent = "Caméra indisponible.";
          cameraErrorEl.classList.remove("hidden");
          state.isCameraBusy = false;
          return;
        }

        try {
          debouncedUsbScannerSubmit.cancel();
          barcodeInput.blur();
          state.isCameraActive = true;
          cameraSection.classList.remove("hidden");
          updateCameraButtonUI();

          const formatsToSupport = typeof Html5QrcodeSupportedFormats !== "undefined"
            ? [
                Html5QrcodeSupportedFormats.EAN_13,
                Html5QrcodeSupportedFormats.EAN_8,
                Html5QrcodeSupportedFormats.UPC_A,
                Html5QrcodeSupportedFormats.UPC_E,
                Html5QrcodeSupportedFormats.CODE_128,
                Html5QrcodeSupportedFormats.CODE_39,
                Html5QrcodeSupportedFormats.ITF,
                Html5QrcodeSupportedFormats.QR_CODE,
                Html5QrcodeSupportedFormats.DATA_MATRIX
              ]
            : undefined;

          const config = {
            fps: 12,
            rememberLastUsedCamera: true,
            qrbox: (viewfinderWidth, viewfinderHeight) => ({
              width: Math.max(50, Math.min(320, Math.floor(viewfinderWidth * 0.85))),
              height: Math.max(50, Math.min(160, Math.floor(viewfinderHeight * 0.55)))
            }),
            ...(formatsToSupport ? { formatsToSupport } : {})
          };

          state.html5QrcodeScanner = new Html5QrcodeScanner("reader", config, /* verbose= */ false);
          state.html5QrcodeScanner.render(
            (decodedText) => handleBarcodeScan(decodedText, "camera"),
            () => {}
          );

          cameraSection.scrollIntoView({ behavior: "smooth", block: "nearest" });
        } catch (err) {
          console.error("Erreur caméra:", err);
          cameraErrorEl.textContent = "Permissions caméra ou HTTPS requis.";
          cameraErrorEl.classList.remove("hidden");
          await stopCamera();
        } finally {
          state.isCameraBusy = false;
        }
      }

      async function stopCamera() {
        if (state.isCameraBusy && !state.isCameraActive) return;
        state.isCameraBusy = true;
        state.isCameraActive = false;

        try {
          if (state.html5QrcodeScanner) {
            await state.html5QrcodeScanner.clear().catch(() => {});
            state.html5QrcodeScanner = null;
          }
          stopDanglingVideoTracks();
        } finally {
          readerEl.innerHTML = "";
          cameraSection.classList.add("hidden");
          state.isCameraBusy = false;
          updateCameraButtonUI();
          focusScannerInput();
        }
      }

      cameraToggleBtn.addEventListener("click", () => {
        AudioFeedback.unlock();
        if (!state.isLoaded) return;
        if (state.isCameraActive) {
          stopCamera();
        } else {
          startCamera();
        }
      });

      document.addEventListener("click", (e) => {
        AudioFeedback.unlock();
        if (!state.isLoaded || state.isCameraActive) return;
        const interactive = e.target.closest("button, input, select, a, #camera-section");
        if (!interactive) focusScannerInput();
      });

      window.addEventListener("focus", () => {
        if (state.isLoaded && !state.isCameraActive) {
          focusScannerInput();
        }
      });

      window.addEventListener("pagehide", () => {
        if (state.isCameraActive) stopCamera();
      });

      window.addEventListener("DOMContentLoaded", () => {
        if (brandLogo && brandLogo.complete && brandLogo.naturalWidth === 0) {
          brandLogo.classList.add("hidden");
          brandFallback.classList.remove("hidden");
        }
        loadZoningDatabase();
      });
    })();
  </script>
</body>
</html>
