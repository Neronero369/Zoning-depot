<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TradiFoot | Zoning</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%2316a34a%22><path d=%22M3 22V8l9-5 9 5v14h-6v-7h-6v7H3zM15 15h4v-4h-4v4zM5 15h4v-4H5v4z%22/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif']
          }
        }
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <style>
    #reader {
      border: none !important;
      border-radius: 1.5rem;
      background-color: transparent;
      color: #1e293b;
      overflow: hidden;
    }
    #reader img {
      display: inline-block;
    }
    #reader__dashboard_section_csr button,
    #reader__dashboard_section_fsr button,
    #reader button {
      background-color: #2563eb !important;
      color: #ffffff !important;
      border: none !important;
      border-radius: 9999px !important;
      padding: 0.6rem 1.25rem !important;
      font-weight: 700 !important;
      font-size: 0.875rem !important;
      cursor: pointer !important;
      margin: 0.35rem 0.25rem !important;
      touch-action: manipulation;
    }
    #reader__dashboard_section_csr button:hover,
    #reader__dashboard_section_fsr button:hover,
    #reader button:hover {
      background-color: #1d4ed8 !important;
    }
    #reader select {
      background-color: #ffffff !important;
      color: #1e293b !important;
      border: 1px solid #d1d5db !important;
      border-radius: 0.75rem !important;
      padding: 0.5rem 0.75rem !important;
      font-size: 0.875rem !important;
      max-width: 100%;
    }
    #reader a {
      color: #2563eb !important;
      text-decoration: underline !important;
    }
    #reader__scan_region video,
    #reader video {
      border-radius: 0.5rem;
      object-fit: cover;
      max-height: 170px !important;
      width: 100%;
    }
    @keyframes scanFlash {
      0% { transform: scale(0.99); }
      50% { transform: scale(1.01); }
      100% { transform: scale(1); }
    }
    .animate-scan-flash {
      animation: scanFlash 200ms ease-out;
    }
    @keyframes shrinkBar {
      from { width: 100%; }
      to { width: 0%; }
    }
    .animate-countdown {
      animation: shrinkBar 3000ms linear forwards;
    }
    @keyframes screenSuccessFlash {
      0% { opacity: 0.75; }
      100% { opacity: 0; }
    }
    .animate-screen-green {
      animation: screenSuccessFlash 650ms ease-out forwards;
    }
    @keyframes streakBump {
      0% { transform: translateX(-50%) scale(1); }
      45% { transform: translateX(-50%) scale(1.16); }
      100% { transform: translateX(-50%) scale(1); }
    }
    .animate-streak-bump {
      animation: streakBump 320ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }
  </style>
</head>
<body class="bg-gradient-to-b from-slate-50 to-slate-100 font-sans text-slate-900 h-screen w-screen overflow-hidden flex items-center justify-center p-2 sm:p-4 antialiased">

  <!-- Full-Screen Flash Overlay for Relocation Confirmation -->
  <div id="screen-flash" class="hidden fixed inset-0 bg-green-500/30 pointer-events-none z-50"></div>

  <!-- Step-and-Repeat Full Background Brand Watermark Layer (Skechers) -->
  <div
    aria-hidden="true"
    class="fixed inset-0 z-0 pointer-events-none overflow-hidden opacity-[0.025] sm:opacity-[0.035]"
  >
    <div class="flex flex-wrap justify-center items-center content-center gap-12 sm:gap-24 w-[150vw] h-[150vh] -ml-[25vw] -mt-[25vh] transform -rotate-12 select-none">
      <img src="./Assets/skechers.png" alt="" class="w-32 sm:w-48 grayscale mix-blend-multiply" />
      <img src="./Assets/skechers.png" alt="" class="w-32 sm:w-48 grayscale mix-blend-multiply" />
      <img src="./Assets/skechers.png" alt="" class="w-32 sm:w-48 grayscale mix-blend-multiply" />
      <img src="./Assets/skechers.png" alt="" class="w-32 sm:w-48 grayscale mix-blend-multiply" />
      <img src="./Assets/skechers.png" alt="" class="w-32 sm:w-48 grayscale mix-blend-multiply" />
      <img src="./Assets/skechers.png" alt="" class="w-32 sm:w-48 grayscale mix-blend-multiply" />
      <img src="./Assets/skechers.png" alt="" class="w-32 sm:w-48 grayscale mix-blend-multiply" />
      <img src="./Assets/skechers.png" alt="" class="w-32 sm:w-48 grayscale mix-blend-multiply" />
      <img src="./Assets/skechers.png" alt="" class="w-32 sm:w-48 grayscale mix-blend-multiply" />
      <img src="./Assets/skechers.png" alt="" class="w-32 sm:w-48 grayscale mix-blend-multiply" />
      <img src="./Assets/skechers.png" alt="" class="w-32 sm:w-48 grayscale mix-blend-multiply" />
      <img src="./Assets/skechers.png" alt="" class="w-32 sm:w-48 grayscale mix-blend-multiply" />
      <img src="./Assets/skechers.png" alt="" class="w-32 sm:w-48 grayscale mix-blend-multiply" />
      <img src="./Assets/skechers.png" alt="" class="w-32 sm:w-48 grayscale mix-blend-multiply" />
      <img src="./Assets/skechers.png" alt="" class="w-32 sm:w-48 grayscale mix-blend-multiply" />
      <img src="./Assets/skechers.png" alt="" class="w-32 sm:w-48 grayscale mix-blend-multiply" />
      <img src="./Assets/skechers.png" alt="" class="w-32 sm:w-48 grayscale mix-blend-multiply" />
      <img src="./Assets/skechers.png" alt="" class="w-32 sm:w-48 grayscale mix-blend-multiply" />
      <img src="./Assets/skechers.png" alt="" class="w-32 sm:w-48 grayscale mix-blend-multiply" />
      <img src="./Assets/skechers.png" alt="" class="w-32 sm:w-48 grayscale mix-blend-multiply" />
      <img src="./Assets/skechers.png" alt="" class="w-32 sm:w-48 grayscale mix-blend-multiply" />
      <img src="./Assets/skechers.png" alt="" class="w-32 sm:w-48 grayscale mix-blend-multiply" />
      <img src="./Assets/skechers.png" alt="" class="w-32 sm:w-48 grayscale mix-blend-multiply" />
      <img src="./Assets/skechers.png" alt="" class="w-32 sm:w-48 grayscale mix-blend-multiply" />
      <img src="./Assets/skechers.png" alt="" class="w-32 sm:w-48 grayscale mix-blend-multiply" />
      <img src="./Assets/skechers.png" alt="" class="w-32 sm:w-48 grayscale mix-blend-multiply" />
      <img src="./Assets/skechers.png" alt="" class="w-32 sm:w-48 grayscale mix-blend-multiply" />
      <img src="./Assets/skechers.png" alt="" class="w-32 sm:w-48 grayscale mix-blend-multiply" />
      <img src="./Assets/skechers.png" alt="" class="w-32 sm:w-48 grayscale mix-blend-multiply" />
      <img src="./Assets/skechers.png" alt="" class="w-32 sm:w-48 grayscale mix-blend-multiply" />
    </div>
  </div>

  <main class="relative z-10 w-full max-w-md mx-auto flex flex-col gap-2 max-h-full">

    <!-- Apple-Style Widget Card -->
    <section
      id="main-card"
      aria-label="TradiFoot Scanner Zoning"
      class="w-full max-w-md bg-white/80 backdrop-blur-2xl border border-white shadow-[0_8px_30px_rgb(0,0,0,0.04)] rounded-[2rem] p-5 flex flex-col relative z-10 transition-all duration-200"
    >
      <!-- Top-Left Admin Stealth Excel Export Button -->
      <button
        id="export-btn"
        type="button"
        title="Exporter vers Excel (.xlsx)"
        aria-label="Exporter vers Excel"
        class="absolute top-4 left-4 text-slate-400 hover:text-slate-600 transition-colors cursor-pointer p-1 touch-manipulation"
      >
        <svg id="export-icon-download" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5m0 0l5-5m-5 5V4" />
        </svg>
        <svg id="export-icon-spinner" xmlns="http://www.w3.org/2000/svg" class="hidden animate-spin w-4 h-4 text-blue-600" fill="none" viewBox="0 0 24 24" aria-hidden="true">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
      </button>

      <!-- Top-Left Voice Picker Toggle Button (Beside Export) -->
      <button
        id="voice-toggle-btn"
        type="button"
        title="Désactiver l'assistance vocale"
        aria-label="Activer ou désactiver l'assistance vocale"
        aria-pressed="true"
        class="absolute top-4 left-10 text-blue-600 hover:text-blue-700 transition-colors cursor-pointer p-1 touch-manipulation"
      >
        <svg id="voice-icon-muted" xmlns="http://www.w3.org/2000/svg" class="hidden w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
        </svg>
        <svg id="voice-icon-active" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
        </svg>
      </button>

      <!-- Network Survival Status Indicator (Online/Offline & Pending Queue) -->
      <div
        id="network-status"
        class="hidden absolute top-4 left-16 flex items-center gap-1 p-1 pointer-events-none select-none"
        title="État réseau / Mode Survie"
        aria-live="polite"
      >
        <svg id="network-icon-offline" xmlns="http://www.w3.org/2000/svg" class="hidden w-4 h-4 text-red-500 animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M18.364 18.364A4 4 0 0019 15a4 4 0 00-3.1-3.9 5.5 5.5 0 00-9.65-2.05M6.343 6.343A4.5 4.5 0 003 10.5c0 .73.174 1.419.483 2.029M6.5 19h9.5" />
        </svg>
        <svg id="network-icon-syncing" xmlns="http://www.w3.org/2000/svg" class="hidden w-4 h-4 text-blue-600 animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 14.899A7 7 0 1115.71 8h1.79a4.5 4.5 0 012.5 8.242M12 12v9m0 0l-3-3m3 3l3-3" />
        </svg>
        <span id="network-queue-count" class="hidden px-1.5 py-0.5 text-[10px] font-bold leading-none rounded-full bg-slate-100 text-slate-700 border border-slate-200/80">0</span>
      </div>

      <!-- Top-Right Stealth History Button & Micro-Status Indicator -->
      <button
        id="history-btn"
        type="button"
        title="Derniers scans"
        aria-label="Afficher l'historique des scans"
        class="absolute top-4 right-10 text-slate-400 hover:text-slate-600 transition-colors cursor-pointer p-1 touch-manipulation"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </button>

      <!-- Top-Right Micro-Status Indicator -->
      <div
        id="db-status"
        role="status"
        aria-live="polite"
        title="Prêt"
        class="absolute top-4 right-4 flex items-center justify-center"
      >
        <span class="block w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse"></span>
      </div>

      <!-- TradiFoot Brand Header & Flow State Streak Badge -->
      <header class="relative mb-5">
        <img
          id="brand-logo"
          src="./Assets/tradifoot.png"
          alt="TradiFoot"
          class="h-8 mx-auto object-contain"
          onerror="this.classList.add('hidden'); document.getElementById('brand-fallback').classList.remove('hidden');"
        />
        <h1
          id="brand-fallback"
          class="hidden text-xl font-black text-slate-900 tracking-tight text-center"
        >
          TRADIFOOT
        </h1>
        <div
          id="streak-badge"
          aria-live="polite"
          class="absolute top-9 left-1/2 transform -translate-x-1/2 flex items-center gap-1.5 px-3 py-1 bg-orange-50/90 backdrop-blur-md border border-orange-200 text-orange-600 rounded-full text-sm font-bold shadow-sm transition-all duration-500 opacity-0 scale-90 pointer-events-none z-20"
        >
          🔥 <span id="streak-count-text">x2</span>
        </div>
      </header>

      <!-- Apple-Style Embedded Camera Viewport (Top of Card when Active) -->
      <div
        id="camera-section"
        aria-label="Caméra"
        class="hidden relative w-full rounded-[1.5rem] overflow-hidden mb-4 shadow-inner border border-slate-100 bg-slate-50"
      >
        <div id="reader" class="w-full"></div>
        <button
          id="change-camera-btn"
          type="button"
          class="hidden absolute bottom-2 right-2 z-20 bg-slate-900/70 hover:bg-slate-900/90 backdrop-blur-md text-white text-xs font-semibold px-3 py-1.5 rounded-full border border-white/20 shadow-md flex items-center gap-1.5 transition-all active:scale-95 touch-manipulation"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          <span>Changer de caméra</span>
        </button>
        <p id="camera-error" class="hidden py-2 px-3 text-center text-xs font-medium text-red-600"></p>
      </div>

      <!-- Dynamic Result & State Machine Card Area -->
      <div
        id="result-panel"
        aria-live="polite"
        class="relative py-1 min-h-[116px] flex flex-col items-center justify-center text-center rounded-2xl transition-all duration-200"
      >
        <!-- Idle State (Mode 1 Ready) -->
        <div id="state-idle" class="flex items-center justify-center text-slate-300">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 7V5a1 1 0 011-1h2M17 4h2a1 1 0 011 1v2M4 17v2a1 1 0 001 1h2M17 20h2a1 1 0 001-1v-2M7 8v8M10 8v8M13 8v8M17 8v8" />
          </svg>
        </div>

        <!-- State 1 Lookup Success -->
        <div id="state-success" class="hidden w-full flex flex-col items-center justify-center">
          <div class="w-full bg-slate-50 border border-slate-100 rounded-3xl p-6 mb-4 flex flex-col items-center justify-center shadow-inner">
            <p id="result-zone" class="text-5xl sm:text-6xl font-black text-slate-900 tracking-tight leading-none break-words"></p>
            <p id="result-sku" class="text-sm font-medium text-slate-500 mt-2 tracking-tight break-all"></p>
          </div>
          <button
            id="relocate-btn"
            type="button"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 px-6 rounded-2xl shadow-md hover:shadow-lg transform active:scale-[0.98] transition-all flex items-center justify-center gap-2 touch-manipulation"
          >
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 21L3 16.5m0 0L7.5 12M3 16.5h13.5m0-13.5L21 7.5m0 0L16.5 12M21 7.5H7.5" />
            </svg>
            <span>Changer de zoning</span>
          </button>
        </div>

        <!-- State 2 Relocation Prompt (Yellow Card — Manual Zone Entry) -->
        <div id="state-relocate" class="hidden w-full bg-yellow-50/80 border border-yellow-200/80 rounded-3xl p-4 flex flex-col items-center justify-center gap-2 shadow-inner">
          <span class="relative flex h-2.5 w-2.5">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-yellow-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-yellow-500"></span>
          </span>
          <p id="relocate-prompt" class="text-base font-bold text-slate-900 tracking-tight leading-snug"></p>
          <form id="relocate-form" autocomplete="off" class="w-full flex flex-col items-center" novalidate>
            <input
              type="text"
              id="manual-zone-input"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="characters"
              spellcheck="false"
              placeholder="Taper la nouvelle zone (ex: A-12-04)"
              class="w-full px-5 py-3.5 bg-slate-100/50 border-0 rounded-2xl text-slate-800 placeholder-slate-400 focus:bg-white focus:ring-2 focus:ring-blue-600 focus:outline-none transition-all shadow-inner uppercase font-medium mb-2.5"
              required
            />
            <p id="relocate-validation-error" class="hidden mb-2 text-xs font-semibold text-red-600 bg-red-50 border border-red-200 rounded-xl px-3 py-1.5 w-full"></p>
            <button
              id="validate-relocate-btn"
              type="submit"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 px-6 rounded-2xl shadow-md hover:shadow-lg transform active:scale-[0.98] transition-all flex items-center justify-center gap-2 touch-manipulation"
            >
              Valider
            </button>
          </form>
          <button
            id="cancel-relocate-btn"
            type="button"
            class="mt-0.5 text-xs font-medium text-slate-500 hover:text-slate-900 underline underline-offset-4 touch-manipulation"
          >
            Annuler
          </button>
        </div>

        <!-- State 2/3 Success Confirmation (Green Card) -->
        <div id="state-relocated" class="hidden w-full bg-green-50/90 border border-green-200 rounded-3xl p-5 flex flex-col items-center justify-center gap-1 shadow-inner">
          <p id="relocated-message" class="text-xl sm:text-2xl font-bold text-green-700 tracking-tight break-words"></p>
        </div>

        <!-- State 3 Create New Barcode (Insert Mode — Manual SKU & Zone Entry) -->
        <div id="state-create" class="hidden w-full bg-slate-50/80 border border-slate-200/80 rounded-3xl p-4 flex flex-col items-center text-center shadow-inner">
          <span id="create-barcode-badge" class="inline-flex items-center px-3 py-0.5 rounded-full text-xs font-mono font-semibold bg-blue-100 text-blue-700 mb-2.5"></span>
          <form id="create-form" autocomplete="off" class="w-full flex flex-col items-center" novalidate>
            <input
              type="text"
              id="new-sku-input"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="characters"
              spellcheck="false"
              placeholder="Saisir le SKU"
              class="w-full px-5 py-3.5 bg-slate-100/50 border-0 rounded-2xl text-slate-800 placeholder-slate-400 focus:bg-white focus:ring-2 focus:ring-blue-600 focus:outline-none transition-all shadow-inner uppercase font-medium mb-2.5"
              required
            />
            <input
              type="text"
              id="new-zone-input"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="characters"
              spellcheck="false"
              placeholder="Saisir la zone de rangement"
              class="w-full px-5 py-3.5 bg-slate-100/50 border-0 rounded-2xl text-slate-800 placeholder-slate-400 focus:bg-white focus:ring-2 focus:ring-blue-600 focus:outline-none transition-all shadow-inner uppercase font-medium mb-2.5"
              required
            />
            <p id="create-validation-error" class="hidden mb-2 text-xs font-semibold text-red-600 bg-red-50 border border-red-200 rounded-xl px-3 py-1.5 w-full"></p>
            <button
              id="create-article-btn"
              type="submit"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 px-6 rounded-2xl shadow-md hover:shadow-lg transform active:scale-[0.98] transition-all flex items-center justify-center gap-2 touch-manipulation"
            >
              Créer l'article
            </button>
          </form>
          <button
            id="cancel-create-btn"
            type="button"
            class="mt-2 text-xs font-medium text-slate-500 hover:text-slate-900 underline underline-offset-4 touch-manipulation"
          >
            Annuler
          </button>
        </div>

        <!-- Lookup Not Found / Error -->
        <div id="state-error" class="hidden w-full flex flex-col items-center justify-center">
          <div class="w-full bg-red-50/70 border border-red-100 rounded-3xl p-5 mb-3 flex flex-col items-center justify-center shadow-inner">
            <p id="error-title" class="text-5xl font-black text-red-600 tracking-tight leading-none">INCONNU</p>
          </div>
          <button
            id="add-article-btn"
            type="button"

        let ctx = null;

        function ensureContext() {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return null;
          if (!ctx) ctx = new AudioCtx();
          if (ctx.state === "suspended") ctx.resume().catch(() => {});
          return ctx;
        }

        function playTone(freq, startOffset, duration, type, volume) {
          const audioCtx = ensureContext();
          if (!audioCtx) return;

          const now = audioCtx.currentTime + startOffset;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.exponentialRampToValueAtTime(volume, now + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(now);
          osc.stop(now + duration + 0.015);
        }

        return {
          unlock() {
            try { ensureContext(); } catch (_) {}
          },
          playSuccess() {

      })();

      function debounce(fn, delayMs) {
        let timerId = null;
        const debounced = function (...args) {
          if (timerId !== null) clearTimeout(timerId);
          timerId = setTimeout(() => {
            timerId = null;
            fn.apply(this, args);
          }, delayMs);
        };
        debounced.cancel = () => {
          if (timerId !== null) {
            clearTimeout(timerId);
            timerId = null;
          }
        };
        return debounced;
      }

        offlineQueue = [];

      let isSyncingQueue = false;

      function updateNetworkUI() {
        const isOnline = typeof navigator === "undefined" || navigator.onLine !== false;
        const count = offlineQueue.length;

        if (!networkStatusEl) return;

        if (isOnline && count === 0) {
          networkStatusEl.classList.add("hidden");
          if (networkIconOffline) networkIconOffline.classList.add("hidden");
          if (networkIconSyncing) networkIconSyncing.classList.add("hidden");
          if (networkQueueCountEl) networkQueueCountEl.classList.add("hidden");

      async function handleOnline() {
        updateNetworkUI();

        const isOnline = typeof navigator === "undefined" || navigator.onLine !== false;
        if (!isOnline || isSyncingQueue || offlineQueue.length === 0 || !supabaseClient) {
          return;
        }

        isSyncingQueue = true;
        renderStatusBusy();
        updateNetworkUI();

        const queueSnapshot = offlineQueue.slice();

        try {
          const results = await Promise.all(
            queueSnapshot.map(async (item) => {
              const payload = {
                barcode: item.barcode,
                zone: item.zone,
                last_updated_at: item.timestamp || new Date().toISOString()
              };
              if (item.sku) {
                payload.sku = item.sku;
              }
              try {
                const { error } = await supabaseClient
                  .from("warehouse_zoning")
                  .upsert(payload, { onConflict: "barcode" });
                return { item, error };
              } catch (err) {
                return { item, error: err };
              }
            })
          );

          const failedEntries = results.filter((r) => r.error);
          const remainingAddedWhileSyncing = offlineQueue.slice(queueSnapshot.length);
          offlineQueue = failedEntries.map((r) => r.item).concat(remainingAddedWhileSyncing);
          saveQueue();

          if (failedEntries.length === 0) {
            renderStatusReady();
            AudioFeedback.playSuccess();
            speakText("Synchronisation terminée");
            triggerHaptic("success");
          } else {
            const firstMsg = failedEntries[0].error?.message || "Erreur de synchronisation";

          renderStatusError(err?.message || "Erreur de synchronisation");
        } finally {
          isSyncingQueue = false;
          updateNetworkUI();
        }

      function enterRelocationMode() {
        if (!state.activeBarcode && !state.activeSku) return;
        clearAutoResetTimer();
        hideAllResultStates();

        state.mode = MODE.RELOCATE;
        if (state.isCameraActive) {

        stateRelocate.classList.remove("hidden");
        triggerCardFlash();

        relocateBtn.blur();
        focusManualField(manualZoneInput);

      async function findItemInSupabase(scannedCode) {
        const cleanCode = sanitizeBarcode(scannedCode);
        if (!cleanCode) {
          return { data: null, matchedBy: "barcode", error: null };
        }

        // 1. Primary exact barcode lookup (strictly sanitized)
        let { data, error } = await supabaseClient
          .from("warehouse_zoning")
          .select("*")
          .eq("barcode", cleanCode)
          .limit(1)
          .single();

        if (data) {
          return { data, matchedBy: "barcode", error: null };
        }
        if (error && error.code !== "PGRST116") {
          return { data: null, matchedBy: "barcode", error };
        }

        // 2. Fallback for UPC-A (12 digits) vs EAN-13 leading "0" mismatch
        if (/^0\d{12}$/.test(cleanCode)) {
          const stripped = sanitizeBarcode(cleanCode.slice(1));
          const upcRes = await supabaseClient
            .from("warehouse_zoning")
            .select("*")
            .eq("barcode", stripped)
            .limit(1)
            .single();
          if (upcRes.data) {
            return { data: upcRes.data, matchedBy: "barcode", error: null };
          }
          if (upcRes.error && upcRes.error.code !== "PGRST116") {
            return { data: null, matchedBy: "barcode", error: upcRes.error };
          }
        } else if (/^\d{12}$/.test(cleanCode)) {
          const padded = sanitizeBarcode(`0${cleanCode}`);
          const eanRes = await supabaseClient
            .from("warehouse_zoning")
            .select("*")
            .eq("barcode", padded)
            .limit(1)
            .single();
          if (eanRes.data) {
            return { data: eanRes.data, matchedBy: "barcode", error: null };
          }
          if (eanRes.error && eanRes.error.code !== "PGRST116") {
            return { data: null, matchedBy: "barcode", error: eanRes.error };
          }
        }

        // 3. Fallback: case-insensitive SKU lookup
        const skuLookupTerm = String(scannedCode ?? "").replace(/[\r\n]+/g, "").trim();
        const escapedSku = skuLookupTerm.replace(/[\\%_]/g, "\\$&");
        const { data: skuRows, error: skuError } = await supabaseClient
          .from("warehouse_zoning")
          .select("*")
          .ilike("sku", escapedSku)
          .limit(10);

        if (skuError) {
          return { data: null, matchedBy: "sku", error: skuError };
        }

        const targetLower = skuLookupTerm.toLowerCase();
        const exactRows = (skuRows || []).filter(
          (row) => String(row.sku ?? "").trim().toLowerCase() === targetLower
        );
        if (exactRows.length === 0) {
          return { data: null, matchedBy: "sku", error: null };
        }

        const preferred =
          exactRows.find((r) => {
            const z = String(r.zone ?? "").trim();
            return z.length > 0 && z.toUpperCase() !== "NO ZONE";
          }) || exactRows[0];

        return { data: preferred, matchedBy: "sku", error: null };
      }

      async function handleState1Lookup(scannedCode, source = "usb") {
        const cleanCode = sanitizeBarcode(scannedCode);
        if (!cleanCode) return;

        if (typeof navigator !== "undefined" && navigator.onLine === false) {
          clearAutoResetTimer();
          hideAllResultStates();
          mainCard.className = "w-full max-w-md bg-white/80 backdrop-blur-2xl border border-white shadow-[0_8px_30px_rgb(0,0,0,0.04)] rounded-[2rem] p-5 flex flex-col relative z-10 transition-all duration-200";
          state.matchedBy = "barcode";
          state.activeBarcode = cleanCode;
          state.activeSku = "HORS-LIGNE";
          state.activeZone = "HORS-LIGNE";
          resultZoneEl.textContent = "HORS-LIGNE";
          resultSkuEl.textContent = "HORS-LIGNE";
          resultSkuEl.classList.remove("hidden");
          updateNetworkUI();
          enterRelocationMode();
          AudioFeedback.playSuccess();
          triggerHaptic("success");
          speakText("Hors ligne");
          return;
        }

        if (!supabaseClient) {
          hideAllResultStates();
          errorTitleEl.textContent = "ERREUR SDK";
          stateError.classList.remove("hidden");
          AudioFeedback.playError();
          scheduleAutoClear();
          return;
        }

        state.isBusy = true;
        renderStatusBusy();

        try {
          const { data, matchedBy, error } = await findItemInSupabase(scannedCode);

          clearAutoResetTimer();
          hideAllResultStates();
          mainCard.className = "w-full max-w-md bg-white/80 backdrop-blur-2xl border border-white shadow-[0_8px_30px_rgb(0,0,0,0.04)] rounded-[2rem] p-5 flex flex-col relative z-10 transition-all duration-200";

          if (error || !data) {
            const isDbError = Boolean(error && error.code !== "PGRST116");
            errorTitleEl.textContent = isDbError ? "ERREUR" : "INCONNU";
            stateError.classList.remove("hidden");
            countdownBar.className = "h-full bg-red-500";
            AudioFeedback.playError();
            triggerHaptic("error");
            if (isDbError) {
              speakText("Erreur");
              state.unknownBarcode = "";
              addArticleBtn.classList.add("hidden");
              renderStatusError(error.message);
              triggerCardFlash();
              scheduleAutoClear();
            } else {
              speakText("Inconnu");
              state.unknownBarcode = cleanCode;
              addArticleBtn.classList.remove("hidden");
              renderStatusReady();
              triggerCardFlash();
            }
            return;
          }

          renderStatusReady();
          state.mode = MODE.LOOKUP;
          state.matchedBy = matchedBy;
          state.activeBarcode = sanitizeBarcode(data.barcode || cleanCode);
          state.activeSku = String(data.sku ?? "").trim();
          state.activeZone = String(data.zone ?? "").trim();

          const hasValidZone =
            state.activeZone.length > 0 &&
            state.activeZone.toUpperCase() !== "NO ZONE";

          if (hasValidZone) {
            resultZoneEl.textContent = state.activeZone;
            resultZoneEl.className = "text-5xl sm:text-6xl font-black text-slate-900 tracking-tight leading-none break-words";
          } else {
            resultZoneEl.textContent = "NO ZONE";
            resultZoneEl.className = "text-4xl sm:text-5xl font-black text-red-600 tracking-tight leading-none";
          }

          resultSkuEl.textContent = state.activeSku;
          resultSkuEl.classList.toggle("hidden", !state.activeSku);
          stateSuccess.classList.remove("hidden");

          addToScanHistory({
            action: "LOOKUP",
            barcode: state.activeBarcode,
            sku: state.activeSku,
            newZone: state.activeZone || "NO ZONE"
          });

          const spokenZone = (hasValidZone ? state.activeZone : "Aucune zone").replace(/-/g, " ");
          AudioFeedback.playSuccess();
          triggerHaptic("success");
          speakText(spokenZone);
          registerStreak();
          triggerCardFlash();
        } catch (err) {
          console.error("Erreur lecture Supabase:", err);
          renderStatusError(err?.message);
          hideAllResultStates();
          state.unknownBarcode = "";
          addArticleBtn.classList.add("hidden");
          errorTitleEl.textContent = "ERREUR";
          stateError.classList.remove("hidden");
          countdownBar.className = "h-full bg-red-500";
          AudioFeedback.playError();
          triggerHaptic("error");
          triggerCardFlash();
          scheduleAutoClear();
        } finally {
          state.isBusy = false;
          if (!state.isCameraActive) {
            if (source === "manual" && !isDesktopPointer()) {
              barcodeInput.blur();
            } else {
              focusScannerInput();
            }
          }
        }
      }

      async function handleState2Relocate() {
        const cleanActiveBarcode = sanitizeBarcode(state.activeBarcode);
        const cleanActiveSku = String(state.activeSku ?? "").replace(/[\r\n]+/g, "").trim().toUpperCase();
        const isOffline = typeof navigator !== "undefined" && navigator.onLine === false;
        if ((!isOffline && !supabaseClient) || (!cleanActiveBarcode && !cleanActiveSku)) {
          resetToIdleState(true);
          return;
        }
        if (state.isBusy) return;

        const newZoneValue = manualZoneInput.value.replace(/[\r\n]+/g, "").trim().toUpperCase();
        if (!newZoneValue) {
          manualZoneInput.classList.add("!ring-2", "!ring-red-500");
          relocateValidationError.textContent = "Veuillez saisir la nouvelle zone";
          relocateValidationError.classList.remove("hidden");
          AudioFeedback.playError();
          triggerHaptic("error");
          triggerCardFlash();
          focusManualField(manualZoneInput);
          return;
        }

        manualZoneInput.classList.remove("!ring-2", "!ring-red-500");
        relocateValidationError.textContent = "";
        relocateValidationError.classList.add("hidden");
        state.isBusy = true;
        validateRelocateBtn.disabled = true;
        renderStatusBusy();

        try {
          if (typeof navigator !== "undefined" && navigator.onLine === false) {
            const offlineBarcode = cleanActiveBarcode || cleanActiveSku;
            const historySku = state.activeSku || cleanActiveBarcode;
            const previousZoneValue = String(state.activeZone ?? "").trim() || "HORS-LIGNE";

            offlineQueue.push({
              barcode: offlineBarcode,
              zone: newZoneValue,
              timestamp: new Date().toISOString()
            });
            saveQueue();

            addToScanHistory({
              action: "RELOCATE",
              matchedBy: state.matchedBy,
              barcode: offlineBarcode,
              sku: historySku,
              oldZone: previousZoneValue,
              newZone: newZoneValue,
              undone: false
            });

            state.mode = MODE.LOOKUP;
            state.matchedBy = "barcode";
            state.activeBarcode = "";
            state.activeSku = "";
            state.activeZone = "";
            state.lastScanCode = "";
            state.lastScanAt = 0;
            clearAllVisibleInputs();
            barcodeInput.placeholder = "SKU ou code-barres...";

            hideAllResultStates();
            mainCard.className = "w-full max-w-md bg-white/80 backdrop-blur-2xl border border-white shadow-[0_8px_30px_rgb(0,0,0,0.04)] rounded-[2rem] p-5 flex flex-col relative z-10 transition-all duration-200";
            relocatedMessageEl.textContent = `Sauvegardé hors-ligne → ${newZoneValue}`;
            stateRelocated.classList.remove("hidden");
            countdownBar.className = "h-full bg-green-500";

            AudioFeedback.playSuccess();
            triggerHaptic("success");
            speakText("Sauvegardé hors-ligne");
            registerStreak();
            triggerScreenGreenFlash();
            triggerCardFlash();
            focusScannerInput(true);
            scheduleAutoClear();
            return;
          }

          const payload = {
            zone: newZoneValue,
            last_updated_at: new Date().toISOString()
          };

          const query =
            state.matchedBy === "sku" && cleanActiveSku
              ? supabaseClient.from("warehouse_zoning").update(payload).eq("sku", state.activeSku.trim()).select()
              : supabaseClient.from("warehouse_zoning").update(payload).eq("barcode", cleanActiveBarcode).select();

          const { data: updatedRows, error } = await query;

          if (error || !updatedRows || updatedRows.length === 0) {
            const msg = error?.message || "Aucune ligne mise à jour (RLS)";
            renderStatusError(msg);
            relocateValidationError.textContent = `Erreur: ${msg}`;
            relocateValidationError.classList.remove("hidden");
            AudioFeedback.playError();
            triggerHaptic("error");
            triggerCardFlash();
            return;
          }

          renderStatusReady();

          const historyBarcode = cleanActiveBarcode || cleanActiveSku;
          const historySku = state.activeSku || cleanActiveBarcode;
          const previousZoneValue = String(state.activeZone ?? "").trim() || "NO ZONE";
          addToScanHistory({
            action: "RELOCATE",
            matchedBy: state.matchedBy,
            barcode: historyBarcode,
            sku: historySku,
            oldZone: previousZoneValue,
            newZone: newZoneValue,
            undone: false
          });

          // Reset to State 1 (Lookup Mode), clear all visible inputs & refocus USB input
          state.mode = MODE.LOOKUP;
          state.matchedBy = "barcode";
          state.activeBarcode = "";
          state.activeSku = "";
          state.activeZone = "";
          state.lastScanCode = "";
          state.lastScanAt = 0;
          clearAllVisibleInputs();
          barcodeInput.placeholder = "SKU ou code-barres...";

          hideAllResultStates();
          mainCard.className = "w-full max-w-md bg-white/80 backdrop-blur-2xl border border-white shadow-[0_8px_30px_rgb(0,0,0,0.04)] rounded-[2rem] p-5 flex flex-col relative z-10 transition-all duration-200";
          relocatedMessageEl.textContent = `Déplacé vers ${newZoneValue}`;
          stateRelocated.classList.remove("hidden");
          countdownBar.className = "h-full bg-green-500";

          AudioFeedback.playSuccess();
          triggerHaptic("success");
          speakText("Déplacé");
          registerStreak();
          triggerScreenGreenFlash();
          triggerCardFlash();
          focusScannerInput(true);
          scheduleAutoClear();
        } catch (err) {
          console.error("Erreur mise à jour Supabase:", err);
          renderStatusError(err?.message);
          relocateValidationError.textContent = "Erreur réseau — réessayez";
          relocateValidationError.classList.remove("hidden");
          AudioFeedback.playError();
          triggerHaptic("error");
          triggerCardFlash();
        } finally {
          state.isBusy = false;
          validateRelocateBtn.disabled = false;
          if (state.mode === MODE.LOOKUP && !state.isCameraActive) {
            focusScannerInput(true);
          }
        }
      }

            });

            });

            state.mode = MODE.LOOKUP;
            state.matchedBy = "barcode";
            state.activeBarcode = "";
            state.activeSku = "";
            state.activeZone = "";
            state.unknownBarcode = "";
            state.lastScanCode = "";
            state.lastScanAt = 0;

            hideAllResultStates();
            mainCard.className = "w-full max-w-md bg-white/80 backdrop-blur-2xl border border-white shadow-[0_8px_30px_rgb(0,0,0,0.04)] rounded-[2rem] p-5 flex flex-col relative z-10 transition-all duration-200";

      async function handleScan(rawCode, source = "usb") {
        if (state.mode !== MODE.LOOKUP) return;
        const rawText = String(rawCode ?? "").replace(/[\r\n]+/g, "").trim();
        const cleanCode = sanitizeBarcode(rawText);
        if (!cleanCode || state.isBusy) return;

        const now = Date.now();
        const cooldown = source === "camera" ? CAMERA_DUPLICATE_COOLDOWN_MS : USB_DUPLICATE_COOLDOWN_MS;
        const dedupeKey = `${source}:${cleanCode}`;

        if (dedupeKey === state.lastScanCode && now - state.lastScanAt < cooldown) {
          if (source !== "camera") {
            barcodeInput.value = "";
            if (source === "usb" || isDesktopPointer()) {
              focusScannerInput();
            }
          }
          return;
        }

        state.lastScanCode = dedupeKey;
        state.lastScanAt = now;
        state.rapidBurstCount = 0;
        state.lastKeyTime = 0;

        if (source !== "camera") {
          barcodeInput.value = "";
        }

        await handleState1Lookup(rawText, source);
      }

        AudioFeedback.unlock();
        enterRelocationMode();
      });

      relocateForm.addEventListener("submit", (e) => {
        e.preventDefault();
        AudioFeedback.unlock();
        handleState2Relocate();
      });

      manualZoneInput.addEventListener("pointerdown", () => {
        barcodeInput.blur();
      });

      manualZoneInput.addEventListener("focus", () => {
        AudioFeedback.unlock();
        barcodeInput.blur();
      });

       * =========================================================================

      const debouncedUsbScannerSubmit = debounce(() => {
        const rawVal = barcodeInput.value;
        barcodeInput.value = "";
        const cleanVal = sanitizeBarcode(rawVal);
        if (cleanVal.length >= 2) {
          handleScan(rawVal, "usb");
        }
      }, USB_DEBOUNCE_MS);

      barcodeInput.addEventListener("keydown", (e) => {
        AudioFeedback.unlock();

        if (e.isComposing || e.key === "Unidentified") {
          state.rapidBurstCount = 0;
          state.lastKeyTime = 0;
          return;
        }

        const now = performance.now();
        const delta = state.lastKeyTime > 0 ? now - state.lastKeyTime : 0;
        state.lastKeyTime = now;

        if (delta > 0 && delta < 35) {
          state.rapidBurstCount += 1;
        } else if (delta >= 80) {
          state.rapidBurstCount = 0;
        }

        if (e.key === "Enter") {
          e.preventDefault();
          debouncedUsbScannerSubmit.cancel();
          const rawVal = barcodeInput.value;
          barcodeInput.value = "";
          const source = state.rapidBurstCount >= 5 ? "usb" : "manual";
          handleScan(rawVal, source);
        }
      });

      barcodeInput.addEventListener("input", () => {
        const val = sanitizeBarcode(barcodeInput.value);
        if (!val) {
          debouncedUsbScannerSubmit.cancel();
          return;
        }

        if (state.rapidBurstCount >= 6) {
          debouncedUsbScannerSubmit();
        } else {
          debouncedUsbScannerSubmit.cancel();

      function stopDanglingVideoTracks() {
        readerEl.querySelectorAll("video").forEach((video) => {
          const stream = video.srcObject;
          if (stream && typeof stream.getTracks === "function") {
            stream.getTracks().forEach((track) => track.stop());
          }
          video.srcObject = null;
        });
      }

      function getSavedCameraId() {
        try {
          return localStorage.getItem(CAMERA_STORAGE_KEY) || "";
        } catch (_) {
          return "";

      function setSavedCameraId(cameraId) {
        try {
          localStorage.setItem(CAMERA_STORAGE_KEY, cameraId);
        } catch (_) {}
      }

      function clearSavedCameraId() {
        try {
          localStorage.removeItem(CAMERA_STORAGE_KEY);
        } catch (_) {}
      }

      function pickPreferredCameraId(cameras) {
        if (!Array.isArray(cameras) || cameras.length === 0) return "";
        const mainRear = cameras.find((cam) => {
          const label = String(cam.label || "").toLowerCase();
          const isRear = /back|rear|environment|arrière|camera2 0/.test(label);
          const isAux = /macro|ultra|wide|tele|depth|front|selfie|avant/.test(label);
          return isRear && !isAux;
        });
        if (mainRear) return mainRear.id;
        const anyRear = cameras.find((cam) => /back|rear|environment|arrière/i.test(cam.label || ""));
        return (anyRear || cameras[0]).id;
      }

        if (typeof Html5Qrcode === "undefined") {

          state.isCameraBusy = false;

        try {
          debouncedUsbScannerSubmit.cancel();
          if (state.mode !== MODE.LOOKUP) {
            resetToIdleState(false);

          barcodeInput.blur();
          manualZoneInput.blur();

          resultPanel.classList.add("hidden");

          cameraSection.classList.remove("hidden");
          changeCameraBtn.classList.remove("hidden");
          updateCameraButtonUI();

          const formatsToSupport = typeof Html5QrcodeSupportedFormats !== "undefined"
            ? [
                Html5QrcodeSupportedFormats.EAN_13,
                Html5QrcodeSupportedFormats.EAN_8,
                Html5QrcodeSupportedFormats.UPC_A,
                Html5QrcodeSupportedFormats.UPC_E,
                Html5QrcodeSupportedFormats.CODE_128,
                Html5QrcodeSupportedFormats.CODE_39,
                Html5QrcodeSupportedFormats.ITF,
                Html5QrcodeSupportedFormats.QR_CODE,
                Html5QrcodeSupportedFormats.DATA_MATRIX
              ]
            : undefined;

          const config = {
            fps: 12,
            qrbox: (viewfinderWidth, viewfinderHeight) => ({
              width: Math.max(50, Math.min(320, Math.floor(viewfinderWidth * 0.85))),
              height: Math.max(50, Math.min(160, Math.floor(viewfinderHeight * 0.55)))
            })
          };

          const html5QrCode = formatsToSupport
            ? new Html5Qrcode("reader", { formatsToSupport, verbose: false })
            : new Html5Qrcode("reader", false);
          state.html5QrCode = html5QrCode;

          await html5QrCode.start(
            cameraId,
            config,
            (decodedText) => handleScan(decodedText, "camera"),
            () => {}

          cameraSection.scrollIntoView({ behavior: "smooth", block: "nearest" });

          console.error("Camera start failed:", err);
          const errName = String(err?.name || err?.message || "");

            clearSavedCameraId();

            await openCameraSelector();

      async function fetchAllZoningRecords() {
        const PAGE_SIZE = 1000;

        async function fetchChunk(from, to, withCount = false) {
          const selectQuery = withCount
            ? supabaseClient
                .from("warehouse_zoning")
                .select("barcode, sku, zone, last_updated_at", { count: "exact" })
            : supabaseClient
                .from("warehouse_zoning")
                .select("barcode, sku, zone, last_updated_at");

          const { data, error, count } = await selectQuery
            .order("zone", { ascending: true })
            .order("barcode", { ascending: true })
            .range(from, to);

          if (error) throw error;
          return {
            rows: Array.isArray(data) ? data : [],
            count: typeof count === "number" ? count : null
          };
        }

        const first = await fetchChunk(0, PAGE_SIZE - 1, true);
        const allRows = [...first.rows];

        if (first.rows.length === 0) {
          return allRows;
        }

        const step = first.rows.length;
        if (first.count !== null) {
          if (allRows.length >= first.count) {
            return allRows;
          }
          const remainingOffsets = [];
          for (let offset = step; offset < first.count; offset += step) {
            remainingOffsets.push(offset);
          }

          const CONCURRENCY = 4;
          for (let i = 0; i < remainingOffsets.length; i += CONCURRENCY) {
            const batch = remainingOffsets.slice(i, i + CONCURRENCY);
            const pages = await Promise.all(
              batch.map((offset) => fetchChunk(offset, offset + step - 1, false))
            );
            for (const page of pages) {
              allRows.push(...page.rows);
            }
          }
          return allRows;
        }

        if (first.rows.length < PAGE_SIZE) {
          return allRows;
        }

        let offset = step;
        while (true) {
          const next = await fetchChunk(offset, offset + step - 1, false);
          allRows.push(...next.rows);
          if (next.rows.length < step) break;
          offset += next.rows.length;
        }
        return allRows;
      }

      function addToScanHistory(entry) {
        const cleanCode = sanitizeBarcode(entry?.barcode);
        const skuValue = String(entry?.sku ?? "").trim() || cleanCode;
        const zoneValue = String(entry?.newZone ?? entry?.zone ?? "").trim() || "NO ZONE";
        const actionType = entry?.action || "LOOKUP";

        const historyItem = {
          action: actionType,
          barcode: cleanCode,
          sku: skuValue,
          zone: zoneValue,
          newZone: zoneValue,
          time: new Date().toLocaleTimeString(),
          undone: Boolean(entry?.undone)
        };

        if (actionType === "RELOCATE") {
          historyItem.oldZone = String(entry?.oldZone ?? "").trim() || "NO ZONE";
          historyItem.matchedBy = entry?.matchedBy || "barcode";
        }

        scanHistory.unshift(historyItem);
        scanHistory = scanHistory.slice(0, 10);
        if (state.isHistoryModalOpen) {
          renderHistoryList();
        }

      async function undoAction(index) {
        const item = scanHistory[index];
        if (!item || item.action !== "RELOCATE" || item.undone || state.isBusy) return;
        if (!supabaseClient) {
          triggerHaptic("error");
          alert("Client Supabase non configuré.");
          return;
        }

        AudioFeedback.unlock();
        state.isBusy = true;
        renderStatusBusy();

        try {
          const useSkuKey =
            item.matchedBy === "sku" &&
            item.sku &&
            (!item.barcode || item.barcode === sanitizeBarcode(item.sku));

          const baseUpdate = supabaseClient
            .from("warehouse_zoning")
            .update({ zone: item.oldZone, last_updated_at: new Date().toISOString() });

          const query = useSkuKey
            ? baseUpdate.eq("sku", item.sku).select()
            : baseUpdate.eq("barcode", item.barcode).select();

          const { data: revertedRows, error } = await query;

          if (error || (Array.isArray(revertedRows) && revertedRows.length === 0)) {
            const msg = error?.message || "Aucune ligne restaurée (RLS)";
            renderStatusError(msg);
            AudioFeedback.playError();
            triggerHaptic("error");
            alert(`Erreur lors de l'annulation : ${msg}`);
            return;
          }

          renderStatusReady();
          scanHistory[index].undone = true;
          renderHistoryList();

          const toastMessage = `Action annulée. Retour à ${item.oldZone}`;
          showHistoryToast(toastMessage);

          hideAllResultStates();
          mainCard.className = "w-full max-w-md bg-white/80 backdrop-blur-2xl border border-white shadow-[0_8px_30px_rgb(0,0,0,0.04)] rounded-[2rem] p-5 flex flex-col relative z-10 transition-all duration-200";

          stateRelocated.classList.remove("hidden");
          countdownBar.className = "h-full bg-green-500";
          scheduleAutoClear();

          AudioFeedback.playSuccess();
          triggerHaptic("success");
          speakText("Annulé");
          registerStreak();
        } catch (err) {
          console.error("Erreur annulation Supabase:", err);
          renderStatusError(err?.message);
          AudioFeedback.playError();
          triggerHaptic("error");
          alert(`Erreur réseau lors de l'annulation : ${err?.message || "Erreur inconnue"}`);
        } finally {
          state.isBusy = false;
        }
      }

          const zoneEl = document.createElement("p");
          zoneEl.className = entry.undone
            ? "text-xs sm:text-sm font-bold text-slate-400 line-through"
            : "text-sm font-bold text-blue-600";
          zoneEl.textContent =
            entry.action === "RELOCATE" && entry.oldZone
              ? `${entry.oldZone} → ${entry.newZone || entry.zone}`
              : (entry.newZone || entry.zone);
          rightCol.appendChild(zoneEl);

          const timeEl = document.createElement("p");
          timeEl.className = "text-[11px] font-medium text-slate-400 mt-0.5";
          timeEl.textContent = entry.time;
          rightCol.appendChild(timeEl);

          rightWrap.appendChild(rightCol);

          if (entry.action === "RELOCATE") {
            if (!entry.undone) {
              const undoBtn = document.createElement("button");
              undoBtn.type = "button";
              undoBtn.title = `Annuler (retour à ${entry.oldZone})`;
              undoBtn.setAttribute("aria-label", `Annuler le déplacement vers ${entry.newZone}`);
              undoBtn.className = "p-2 bg-slate-100 hover:bg-blue-100 text-slate-500 hover:text-blue-600 rounded-full transition-colors cursor-pointer touch-manipulation";
              undoBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3" /></svg>`;
              undoBtn.addEventListener("click", () => undoAction(index));
              rightWrap.appendChild(undoBtn);
            } else {
              const undoneBadge = document.createElement("span");
              undoneBadge.className = "text-[11px] font-semibold text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full";
              undoneBadge.textContent = "Annulé";
              rightWrap.appendChild(undoneBadge);
            }
          }

          item.appendChild(leftCol);
          item.appendChild(rightWrap);
          historyListEl.appendChild(item);
        });
      }

      function openHistoryModal() {
        AudioFeedback.unlock();
        historyBtn.blur();
        barcodeInput.blur();
        manualZoneInput.blur();
        newSkuInput.blur();
        newZoneInput.blur();
        renderHistoryList();
        state.isHistoryModalOpen = true;
        historyModal.classList.remove("hidden");
        historyModal.classList.add("flex");
      }

      function closeHistoryModal() {
        historyModal.classList.add("hidden");
        historyModal.classList.remove("flex");
        state.isHistoryModalOpen = false;
        if (state.mode === MODE.LOOKUP && !state.isCameraActive && !state.isCameraPickerOpen) {
          focusScannerInput();
        }
      }

      historyBtn.addEventListener("click", openHistoryModal);
      closeHistoryBtn.addEventListener("click", () => {
        AudioFeedback.unlock();
        closeHistoryBtn.blur();
        closeHistoryModal();
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && state.isHistoryModalOpen) {
          closeHistoryModal();
        }
      });

      document.addEventListener("click", (e) => {
        AudioFeedback.unlock();
        if (state.isCameraActive || state.isCameraPickerOpen || state.isHistoryModalOpen) return;
        const interactive = e.target.closest("button, input, select, a, #camera-section, #camera-picker, #history-modal");
        if (!interactive) focusScannerInput();
      });

      window.addEventListener("focus", () => {
        if (!state.isCameraActive && !state.isCameraPickerOpen && !state.isHistoryModalOpen) {
          focusScannerInput();
        }
      });

      /**
       * =========================================================================
       * 10. GESTURE NAVIGATION (TOUCH SWIPE TO UNDO / CLEAR)
       * =========================================================================
       */
      let touchStartX = 0;
      let touchEndX = 0;
      let touchStartY = 0;
      let touchEndY = 0;

      function handleSwipe() {
        if (state.isHistoryModalOpen) return;

        const deltaX = touchEndX - touchStartX;
        const deltaY = touchEndY - touchStartY;
        const swipeThreshold = 70;

        if (Math.abs(deltaX) <= swipeThreshold || Math.abs(deltaY) > Math.abs(deltaX)) {
          return;
        }

        if (deltaX < -swipeThreshold) {
          // Swipe Left -> Quick Undo latest eligible relocation
          const latestItem = scanHistory[0];
          if (latestItem && !latestItem.undone && latestItem.action === "RELOCATE") {
            undoAction(0);
          }
          return;
        }

        if (deltaX > swipeThreshold) {
          // Swipe Right -> Clear / Next scan (Abort current view & reset to State 1)
          AudioFeedback.unlock();
          state.lastScanCode = "";
          state.lastScanAt = 0;
          clearAllVisibleInputs();
          resetToIdleState(true);
          triggerCardFlash();
          triggerHaptic("success");
        }
      }
      window.handleSwipe = handleSwipe;

      mainCard.addEventListener(
        "touchstart",
        (e) => {
          const touch = e.changedTouches && e.changedTouches[0];
          if (!touch) return;
          touchStartX = touch.screenX;
          touchStartY = touch.screenY;
        },
        { passive: true }
      );

      mainCard.addEventListener(
        "touchend",
        (e) => {
          const touch = e.changedTouches && e.changedTouches[0];
          if (!touch) return;
          touchEndX = touch.screenX;
          touchEndY = touch.screenY;
          handleSwipe();
        },
        { passive: true }
      );

      window.addEventListener("online", handleOnline);
      window.addEventListener("offline", updateNetworkUI);

      window.addEventListener("pagehide", () => {
        if (state.isCameraActive || state.isCameraPickerOpen) stopCamera();
      });

      window.addEventListener("DOMContentLoaded", () => {
        if (brandLogo && brandLogo.complete && brandLogo.naturalWidth === 0) {
          brandLogo.classList.add("hidden");
          brandFallback.classList.remove("hidden");
        }
        updateNetworkUI();
        renderStatusReady();
        focusScannerInput();
        if (typeof navigator === "undefined" || navigator.onLine !== false) {
          if (offlineQueue.length > 0) handleOnline();
        }
      });
    })();
  </script>
</body>
</html>
