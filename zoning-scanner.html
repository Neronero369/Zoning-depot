<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRADIFOOT — WMS Supabase Scanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif']
          }
        }
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    #reader {
      border: 1px solid #e5e7eb !important;
      border-radius: 0.75rem;
      background-color: #f9fafb;
      color: #1e293b;
      overflow: hidden;
    }
    #reader img {
      display: inline-block;
    }
    #reader__dashboard_section_csr button,
    #reader__dashboard_section_fsr button,
    #reader button {
      background-color: #2563eb !important;
      color: #ffffff !important;
      border: none !important;
      border-radius: 9999px !important;
      padding: 0.6rem 1.25rem !important;
      font-weight: 700 !important;
      font-size: 0.875rem !important;
      cursor: pointer !important;
      margin: 0.35rem 0.25rem !important;
      touch-action: manipulation;
    }
    #reader__dashboard_section_csr button:hover,
    #reader__dashboard_section_fsr button:hover,
    #reader button:hover {
      background-color: #1d4ed8 !important;
    }
    #reader select {
      background-color: #ffffff !important;
      color: #1e293b !important;
      border: 1px solid #d1d5db !important;
      border-radius: 0.75rem !important;
      padding: 0.5rem 0.75rem !important;
      font-size: 0.875rem !important;
      max-width: 100%;
    }
    #reader a {
      color: #2563eb !important;
      text-decoration: underline !important;
    }
    #reader__scan_region video {
      border-radius: 0.5rem;
      object-fit: cover;
    }
    @keyframes scanFlash {
      0% { transform: scale(0.99); }
      50% { transform: scale(1.01); }
      100% { transform: scale(1); }
    }
    .animate-scan-flash {
      animation: scanFlash 200ms ease-out;
    }
    @keyframes shrinkBar {
      from { width: 100%; }
      to { width: 0%; }
    }
    .animate-countdown {
      animation: shrinkBar 3000ms linear forwards;
    }
    @keyframes screenSuccessFlash {
      0% { opacity: 0.75; }
      100% { opacity: 0; }
    }
    .animate-screen-green {
      animation: screenSuccessFlash 650ms ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex items-center justify-center p-4 antialiased">

  <!-- Full-Screen Flash Overlay for Relocation Confirmation -->
  <div id="screen-flash" class="hidden fixed inset-0 bg-green-500/30 pointer-events-none z-50"></div>

  <main class="w-full max-w-md mx-auto flex flex-col gap-4">

    <!-- Ultra-Minimalist Industrial Scanner Card -->
    <section
      id="main-card"
      aria-label="TRADIFOOT Scanner Zoning"
      class="relative bg-white border border-gray-200 rounded-2xl shadow-sm p-6 sm:p-8 flex flex-col transition-colors duration-200"
    >
      <!-- Top-Right Micro-Status Indicator -->
      <div
        id="db-status"
        role="status"
        aria-live="polite"
        title="Prêt"
        class="absolute top-4 right-4 flex items-center justify-center"
      >
        <span class="block w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse"></span>
      </div>

      <!-- Brand Injection -->
      <header class="pt-1">
        <img
          id="brand-logo"
          src="./logo.png"
          alt="TRADIFOOT"
          class="h-8 mx-auto mb-6 object-contain"
          onerror="this.classList.add('hidden'); document.getElementById('brand-fallback').classList.remove('hidden');"
        />
        <h1
          id="brand-fallback"
          class="hidden text-2xl font-black text-slate-800 tracking-tighter text-center mb-6"
        >
          TRADIFOOT
        </h1>
      </header>

      <!-- Dynamic Result & State Machine Card Area -->
      <div
        id="result-panel"
        aria-live="polite"
        class="relative py-8 min-h-[180px] flex flex-col items-center justify-center text-center rounded-xl transition-colors duration-200"
      >
        <!-- Idle State (Mode 1 Ready) -->
        <div id="state-idle" class="flex items-center justify-center text-slate-200">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 7V5a1 1 0 011-1h2M17 4h2a1 1 0 011 1v2M4 17v2a1 1 0 001 1h2M17 20h2a1 1 0 001-1v-2M7 8v8M10 8v8M13 8v8M17 8v8" />
          </svg>
        </div>

        <!-- State 1 Lookup Success -->
        <div id="state-success" class="hidden w-full flex flex-col items-center justify-center">
          <p id="result-zone" class="text-7xl font-black text-slate-900 tracking-tighter leading-none break-words"></p>
          <p id="result-sku" class="text-lg font-medium text-slate-400 mt-3 break-all"></p>
          <button
            id="relocate-btn"
            type="button"
            class="mt-6 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-6 rounded-full flex items-center justify-center gap-2 transition-colors touch-manipulation"
          >
            🔄 Déplacer l'article
          </button>
        </div>

        <!-- State 2 Relocation Prompt (Yellow Card — Manual Zone Entry) -->
        <div id="state-relocate" class="hidden w-full bg-yellow-50 border-2 border-yellow-400 rounded-xl p-6 flex flex-col items-center justify-center gap-3">
          <span class="relative flex h-3 w-3">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-yellow-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-3 w-3 bg-yellow-500"></span>
          </span>
          <p id="relocate-prompt" class="text-lg font-bold text-slate-900 tracking-tight leading-snug"></p>
          <form id="relocate-form" autocomplete="off" class="w-full flex flex-col items-center mt-1" novalidate>
            <input
              type="text"
              id="manual-zone-input"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="characters"
              spellcheck="false"
              placeholder="Taper la nouvelle zone (ex: A-12-04)"
              class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white text-slate-800 text-sm font-medium mb-4 uppercase"
              required
            />
            <p id="relocate-validation-error" class="hidden -mt-2 mb-3 text-xs font-bold text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-1.5 w-full"></p>
            <button
              id="validate-relocate-btn"
              type="submit"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-6 rounded-full flex items-center justify-center gap-2 transition-colors touch-manipulation"
            >
              Valider
            </button>
          </form>
          <button
            id="cancel-relocate-btn"
            type="button"
            class="mt-1 text-xs font-semibold text-slate-500 hover:text-slate-800 underline underline-offset-4 touch-manipulation"
          >
            Annuler
          </button>
        </div>

        <!-- State 2/3 Success Confirmation (Green Card) -->
        <div id="state-relocated" class="hidden w-full bg-green-50 border-2 border-green-500 rounded-xl p-6 flex flex-col items-center justify-center gap-2">
          <p id="relocated-message" class="text-2xl sm:text-3xl font-black text-green-700 tracking-tight break-words"></p>
        </div>

        <!-- State 3 Create New Barcode (Insert Mode — Manual SKU & Zone Entry) -->
        <div id="state-create" class="hidden w-full bg-slate-50 border-2 border-blue-300 rounded-xl p-5 flex flex-col items-center text-center">
          <span id="create-barcode-badge" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-mono font-semibold bg-blue-100 text-blue-800 mb-4"></span>
          <form id="create-form" autocomplete="off" class="w-full flex flex-col items-center" novalidate>
            <input
              type="text"
              id="new-sku-input"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="characters"
              spellcheck="false"
              placeholder="Saisir le SKU"
              class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white text-slate-800 text-sm font-medium mb-4 uppercase"
              required
            />
            <input
              type="text"
              id="new-zone-input"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="characters"
              spellcheck="false"
              placeholder="Saisir la zone de rangement"
              class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white text-slate-800 text-sm font-medium mb-4 uppercase"
              required
            />
            <p id="create-validation-error" class="hidden -mt-2 mb-3 text-xs font-bold text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-1.5 w-full"></p>
            <button
              id="create-article-btn"
              type="submit"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-6 rounded-full flex items-center justify-center gap-2 transition-colors touch-manipulation"
            >
              Créer l'article
            </button>
          </form>
          <button
            id="cancel-create-btn"
            type="button"
            class="mt-3 text-xs font-semibold text-slate-500 hover:text-slate-800 underline underline-offset-4 touch-manipulation"
          >
            Annuler
          </button>
        </div>

        <!-- Lookup Not Found / Error -->
        <div id="state-error" class="hidden w-full flex flex-col items-center justify-center">
          <p id="error-title" class="text-6xl font-black text-red-600 tracking-tighter leading-none">INCONNU</p>
          <button
            id="add-article-btn"
            type="button"
            class="hidden mt-6 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-6 rounded-full flex items-center justify-center gap-2 transition-colors touch-manipulation"
          >
            ➕ Ajouter cet article
          </button>
        </div>

        <!-- Auto-Clear Countdown Hairline -->
        <div id="countdown-track" class="hidden absolute bottom-1 left-6 right-6 h-0.5 bg-slate-100 rounded-full overflow-hidden">
          <div id="countdown-bar" class="h-full bg-green-500"></div>
        </div>
      </div>

      <!-- Minimalist Pill Input (SKU Typing + Auto-Focused USB Douchette in State 1 & 2) -->
      <form id="usb-scan-form" autocomplete="off" class="relative mt-2">
        <input
          id="barcode-input"
          name="barcode"
          type="text"
          inputmode="text"
          enterkeyhint="search"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="SKU ou code-barres..."
          aria-label="Saisir SKU ou scanner code-barres"
          class="w-full h-11 bg-slate-50 border border-gray-200 focus:border-blue-500 focus:bg-white focus:outline-none rounded-full pl-5 pr-12 text-center text-sm font-medium text-slate-800 placeholder-slate-400 transition-colors"
        />
        <button
          id="submit-scan-btn"
          type="submit"
          aria-label="Rechercher"
          class="absolute right-1.5 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-slate-200/80 hover:bg-blue-600 text-slate-600 hover:text-white flex items-center justify-center transition-colors touch-manipulation"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </button>
      </form>

      <!-- Mobile Camera Trigger Button -->
      <button
        id="camera-toggle-btn"
        type="button"
        class="mt-3 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-6 rounded-full flex items-center justify-center gap-2.5 transition-colors touch-manipulation"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h2l1.5-2h7L17 7h2a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
          <circle cx="12" cy="13" r="3.5" />
        </svg>
        <span id="camera-btn-label">Scanner</span>
      </button>
    </section>

    <!-- Camera Viewport Card -->
    <section
      id="camera-section"
      aria-label="Caméra"
      class="hidden bg-white border border-gray-200 rounded-2xl shadow-sm p-4"
    >
      <div id="reader" class="w-full"></div>
      <p id="camera-error" class="hidden mt-3 text-center text-xs font-medium text-red-600"></p>
    </section>

  </main>

  <script>
    (() => {
      "use strict";

      /**
       * =========================================================================
       * 1. SUPABASE INITIALIZATION (Replace placeholders with live credentials)
       * =========================================================================
       */
      const SUPABASE_URL = "https://gmdgnzokgqyivlfeosdy.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_JPqzQ4b11U9BU8HzG16k2g_O2cHl5ur";

      const isSupabaseConfigured =
        SUPABASE_URL &&
        !SUPABASE_URL.includes("your-project-id") &&
        SUPABASE_ANON_KEY &&
        !SUPABASE_ANON_KEY.includes("your-supabase-anon-key");

      const supabaseClient =
        typeof window.supabase !== "undefined" &&
        typeof window.supabase.createClient === "function"
          ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
          : null;

      function sanitizeBarcode(rawInput) {
        return String(rawInput ?? "")
          .replace(/[\n\r\s]+/g, "")
          .replace(/[\x00-\x1F\x7F\u200B-\u200D\uFEFF]+/g, "")
          .trim();
      }
      window.sanitizeBarcode = sanitizeBarcode;

      /**
       * =========================================================================
       * 2. AUDIO FEEDBACK ENGINE (Synthesized Web Audio API)
       * =========================================================================
       */
      const AudioFeedback = (() => {
        let ctx = null;

        function ensureContext() {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return null;
          if (!ctx) ctx = new AudioCtx();
          if (ctx.state === "suspended") ctx.resume().catch(() => {});
          return ctx;
        }

        function playTone(freq, startOffset, duration, type, volume) {
          const audioCtx = ensureContext();
          if (!audioCtx) return;

          const now = audioCtx.currentTime + startOffset;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.exponentialRampToValueAtTime(volume, now + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(now);
          osc.stop(now + duration + 0.015);
        }

        return {
          unlock() {
            try { ensureContext(); } catch (_) {}
          },
          playSuccess() {
            try {
              playTone(987.77, 0.0, 0.075, "sine", 0.25);
              playTone(1318.51, 0.075, 0.11, "sine", 0.28);
              if (navigator.vibrate) navigator.vibrate(70);
            } catch (_) {}
          },
          playError() {
            try {
              playTone(155, 0.0, 0.12, "sawtooth", 0.22);
              playTone(125, 0.15, 0.18, "sawtooth", 0.22);
              if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
            } catch (_) {}
          }
        };
      })();

      /**
       * =========================================================================
       * 3. DEBOUNCE, DOM REFERENCES & TWO-STEP STATE MACHINE
       * =========================================================================
       */
      function debounce(fn, delayMs) {
        let timerId = null;
        const debounced = function (...args) {
          if (timerId !== null) clearTimeout(timerId);
          timerId = setTimeout(() => {
            timerId = null;
            fn.apply(this, args);
          }, delayMs);
        };
        debounced.cancel = () => {
          if (timerId !== null) {
            clearTimeout(timerId);
            timerId = null;
          }
        };
        return debounced;
      }

      const MODE = {
        LOOKUP: "LOOKUP",
        RELOCATE: "RELOCATE",
        CREATE: "CREATE"
      };

      const brandLogo = document.getElementById("brand-logo");
      const brandFallback = document.getElementById("brand-fallback");
      const mainCard = document.getElementById("main-card");
      const dbStatusEl = document.getElementById("db-status");
      const screenFlashEl = document.getElementById("screen-flash");

      const barcodeInput = document.getElementById("barcode-input");
      const usbScanForm = document.getElementById("usb-scan-form");
      const cameraToggleBtn = document.getElementById("camera-toggle-btn");
      const cameraBtnLabel = document.getElementById("camera-btn-label");
      const cameraSection = document.getElementById("camera-section");
      const cameraErrorEl = document.getElementById("camera-error");
      const readerEl = document.getElementById("reader");

      const resultPanel = document.getElementById("result-panel");
      const stateIdle = document.getElementById("state-idle");
      const stateSuccess = document.getElementById("state-success");
      const stateRelocate = document.getElementById("state-relocate");
      const stateRelocated = document.getElementById("state-relocated");
      const stateCreate = document.getElementById("state-create");
      const stateError = document.getElementById("state-error");

      const resultZoneEl = document.getElementById("result-zone");
      const resultSkuEl = document.getElementById("result-sku");
      const relocateBtn = document.getElementById("relocate-btn");
      const relocatePromptEl = document.getElementById("relocate-prompt");
      const relocateForm = document.getElementById("relocate-form");
      const manualZoneInput = document.getElementById("manual-zone-input");
      const relocateValidationError = document.getElementById("relocate-validation-error");
      const validateRelocateBtn = document.getElementById("validate-relocate-btn");
      const cancelRelocateBtn = document.getElementById("cancel-relocate-btn");
      const relocatedMessageEl = document.getElementById("relocated-message");
      const createBarcodeBadge = document.getElementById("create-barcode-badge");
      const createForm = document.getElementById("create-form");
      const newSkuInput = document.getElementById("new-sku-input");
      const newZoneInput = document.getElementById("new-zone-input");
      const createValidationError = document.getElementById("create-validation-error");
      const createArticleBtn = document.getElementById("create-article-btn");
      const cancelCreateBtn = document.getElementById("cancel-create-btn");
      const errorTitleEl = document.getElementById("error-title");
      const addArticleBtn = document.getElementById("add-article-btn");
      const countdownTrack = document.getElementById("countdown-track");
      const countdownBar = document.getElementById("countdown-bar");

      const state = {
        mode: MODE.LOOKUP,
        matchedBy: "barcode",
        activeBarcode: "",
        activeSku: "",
        activeZone: "",
        unknownBarcode: "",
        isBusy: false,
        isCameraActive: false,
        isCameraBusy: false,
        html5QrcodeScanner: null,
        autoClearTimer: null,
        lastScanCode: "",
        lastScanAt: 0,
        lastKeyTime: 0,
        rapidBurstCount: 0
      };

      const AUTO_CLEAR_MS = 3000;
      const USB_DEBOUNCE_MS = 160;
      const USB_DUPLICATE_COOLDOWN_MS = 350;
      const CAMERA_DUPLICATE_COOLDOWN_MS = 1800;

      /**
       * =========================================================================
       * 4. STATUS DOT, CARD VISUAL STATES & GHOST USB FOCUS
       * =========================================================================
       */
      function renderStatusBusy() {
        dbStatusEl.title = "Synchronisation Supabase...";
        dbStatusEl.innerHTML = `
          <span class="relative flex items-center justify-center w-5 h-5">
            <svg class="animate-spin w-4 h-4 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" aria-hidden="true">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            <span class="absolute w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
          </span>
        `;
      }

      function renderStatusReady() {
        if (!supabaseClient || !isSupabaseConfigured) {
          dbStatusEl.title = "Configurer SUPABASE_URL et SUPABASE_ANON_KEY";
          dbStatusEl.innerHTML = `<span class="block w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse"></span>`;
        } else {
          dbStatusEl.title = "Supabase connecté";
          dbStatusEl.innerHTML = `<span class="block w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse"></span>`;
        }
      }

      function renderStatusError(msg) {
        dbStatusEl.title = msg || "Erreur Supabase";
        dbStatusEl.innerHTML = `<span class="block w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse"></span>`;
      }

      function isDesktopPointer() {
        return typeof window.matchMedia !== "function" || window.matchMedia("(pointer: fine)").matches;
      }

      function focusScannerInput(force = false) {
        if (state.isCameraActive) return;
        if (state.mode !== MODE.LOOKUP) return;
        if (!force && !isDesktopPointer()) return;
        if (document.activeElement !== barcodeInput) {
          barcodeInput.focus({ preventScroll: true });
        }
        requestAnimationFrame(() => {
          if (
            !state.isCameraActive &&
            state.mode === MODE.LOOKUP &&
            document.activeElement !== barcodeInput
          ) {
            barcodeInput.focus({ preventScroll: true });
          }
        });
      }

      function focusManualField(inputEl) {
        barcodeInput.blur();
        inputEl.focus({ preventScroll: true });
        requestAnimationFrame(() => {
          if (state.mode !== MODE.LOOKUP && document.activeElement !== inputEl) {
            barcodeInput.blur();
            inputEl.focus({ preventScroll: true });
          }
        });
      }

      function clearAllVisibleInputs() {
        manualZoneInput.blur();
        newSkuInput.blur();
        newZoneInput.blur();
        manualZoneInput.value = "";
        newSkuInput.value = "";
        newZoneInput.value = "";
        barcodeInput.value = "";
      }

      function updateCameraButtonUI() {
        if (state.isCameraActive) {
          cameraToggleBtn.className = "mt-3 w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3.5 px-6 rounded-full flex items-center justify-center gap-2.5 transition-colors touch-manipulation";
          cameraBtnLabel.textContent = "Fermer";
        } else {
          cameraToggleBtn.className = "mt-3 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-6 rounded-full flex items-center justify-center gap-2.5 transition-colors touch-manipulation";
          cameraBtnLabel.textContent = "Scanner";
        }
      }

      function clearAutoResetTimer() {
        if (state.autoClearTimer !== null) {
          clearTimeout(state.autoClearTimer);
          state.autoClearTimer = null;
        }
      }

      function hideAllResultStates() {
        stateIdle.classList.add("hidden");
        stateSuccess.classList.add("hidden");
        stateRelocate.classList.add("hidden");
        stateRelocated.classList.add("hidden");

       * 5. TWO-STEP SUPABASE SCAN LOGIC (STATE 1 LOOKUP -> STATE 2 RELOCATION)

      function enterRelocationMode() {
        if (!state.activeBarcode && !state.activeSku) return;
        clearAutoResetTimer();

        state.mode = MODE.RELOCATE;
        if (state.isCameraActive) {

        relocateBtn.blur();

      async function findItemInSupabase(scannedCode) {
        const cleanCode = sanitizeBarcode(scannedCode);
        if (!cleanCode) {
          return { data: null, matchedBy: "barcode", error: null };
        }

        // 1. Primary exact barcode lookup (strictly sanitized)
        let { data, error } = await supabaseClient
          .from("warehouse_zoning")
          .select("*")
          .eq("barcode", cleanCode)
          .limit(1)
          .single();

        if (data) {
          return { data, matchedBy: "barcode", error: null };
        }
        if (error && error.code !== "PGRST116") {
          return { data: null, matchedBy: "barcode", error };
        }

        // 2. Fallback for UPC-A (12 digits) vs EAN-13 leading "0" mismatch
        if (/^0\d{12}$/.test(cleanCode)) {
          const stripped = sanitizeBarcode(cleanCode.slice(1));
          const upcRes = await supabaseClient
            .from("warehouse_zoning")
            .select("*")
            .eq("barcode", stripped)
            .limit(1)
            .single();
          if (upcRes.data) {
            return { data: upcRes.data, matchedBy: "barcode", error: null };
          }
          if (upcRes.error && upcRes.error.code !== "PGRST116") {
            return { data: null, matchedBy: "barcode", error: upcRes.error };
          }
        } else if (/^\d{12}$/.test(cleanCode)) {
          const padded = sanitizeBarcode(`0${cleanCode}`);
          const eanRes = await supabaseClient
            .from("warehouse_zoning")
            .select("*")
            .eq("barcode", padded)
            .limit(1)
            .single();
          if (eanRes.data) {
            return { data: eanRes.data, matchedBy: "barcode", error: null };
          }
          if (eanRes.error && eanRes.error.code !== "PGRST116") {
            return { data: null, matchedBy: "barcode", error: eanRes.error };
          }
        }

        // 3. Fallback: case-insensitive SKU lookup
        const skuLookupTerm = String(scannedCode ?? "").replace(/[\r\n]+/g, "").trim();
        const escapedSku = skuLookupTerm.replace(/[\\%_]/g, "\\$&");
        const { data: skuRows, error: skuError } = await supabaseClient
          .from("warehouse_zoning")
          .select("*")
          .ilike("sku", escapedSku)
          .limit(10);

        if (skuError) {
          return { data: null, matchedBy: "sku", error: skuError };
        }

        const targetLower = skuLookupTerm.toLowerCase();
        const exactRows = (skuRows || []).filter(
          (row) => String(row.sku ?? "").trim().toLowerCase() === targetLower
        );
        if (exactRows.length === 0) {
          return { data: null, matchedBy: "sku", error: null };
        }

        const preferred =
          exactRows.find((r) => {
            const z = String(r.zone ?? "").trim();
            return z.length > 0 && z.toUpperCase() !== "NO ZONE";
          }) || exactRows[0];

        return { data: preferred, matchedBy: "sku", error: null };
      }

      async function handleState1Lookup(scannedCode, source = "usb") {
        const cleanCode = sanitizeBarcode(scannedCode);
        if (!cleanCode) return;

        if (!supabaseClient) {
          hideAllResultStates();
          errorTitleEl.textContent = "ERREUR SDK";
          stateError.classList.remove("hidden");
          AudioFeedback.playError();
          scheduleAutoClear();
          return;
        }

        state.isBusy = true;
        renderStatusBusy();

        try {
          const { data, matchedBy, error } = await findItemInSupabase(scannedCode);

          clearAutoResetTimer();
          hideAllResultStates();
          mainCard.className = "relative bg-white border border-gray-200 rounded-2xl shadow-sm p-6 sm:p-8 flex flex-col transition-colors duration-200";

          if (error || !data) {
            const isDbError = Boolean(error && error.code !== "PGRST116");
            errorTitleEl.textContent = isDbError ? "ERREUR" : "INCONNU";
            stateError.classList.remove("hidden");
            countdownBar.className = "h-full bg-red-500";
            AudioFeedback.playError();
            if (isDbError) {
              state.unknownBarcode = "";
              addArticleBtn.classList.add("hidden");
              renderStatusError(error.message);
              triggerCardFlash();
              scheduleAutoClear();
            } else {
              state.unknownBarcode = cleanCode;
              addArticleBtn.classList.remove("hidden");
              renderStatusReady();
              triggerCardFlash();
            }
            return;
          }

          renderStatusReady();
          state.mode = MODE.LOOKUP;
          state.matchedBy = matchedBy;
          state.activeBarcode = sanitizeBarcode(data.barcode || cleanCode);
          state.activeSku = String(data.sku ?? "").trim();
          state.activeZone = String(data.zone ?? "").trim();

          const hasValidZone =
            state.activeZone.length > 0 &&
            state.activeZone.toUpperCase() !== "NO ZONE";

          if (hasValidZone) {
            resultZoneEl.textContent = state.activeZone;
            resultZoneEl.className = "text-7xl font-black text-slate-900 tracking-tighter leading-none break-words";
          } else {
            resultZoneEl.textContent = "NO ZONE";
            resultZoneEl.className = "text-5xl sm:text-6xl font-black text-red-600 tracking-tighter leading-none";
          }

          resultSkuEl.textContent = state.activeSku;
          resultSkuEl.classList.toggle("hidden", !state.activeSku);
          stateSuccess.classList.remove("hidden");

          AudioFeedback.playSuccess();
          triggerCardFlash();
        } catch (err) {
          console.error("Erreur lecture Supabase:", err);
          renderStatusError(err?.message);
          hideAllResultStates();
          state.unknownBarcode = "";
          addArticleBtn.classList.add("hidden");
          errorTitleEl.textContent = "ERREUR";
          stateError.classList.remove("hidden");
          countdownBar.className = "h-full bg-red-500";
          AudioFeedback.playError();
          triggerCardFlash();
          scheduleAutoClear();
        } finally {
          state.isBusy = false;
          if (!state.isCameraActive) {
            if (source === "manual" && !isDesktopPointer()) {
              barcodeInput.blur();
            } else {
              focusScannerInput();
            }
          }
        }
      }

      async function handleState2Relocate() {
        const cleanActiveBarcode = sanitizeBarcode(state.activeBarcode);
        const cleanActiveSku = String(state.activeSku ?? "").replace(/[\r\n]+/g, "").trim().toUpperCase();
        if (!supabaseClient || (!cleanActiveBarcode && !cleanActiveSku)) {
          resetToIdleState(true);
          return;
        }
        if (state.isBusy) return;

        const newZoneValue = manualZoneInput.value.replace(/[\r\n]+/g, "").trim().toUpperCase();
        if (!newZoneValue) {
          manualZoneInput.classList.add("border-red-500");
          relocateValidationError.textContent = "Veuillez saisir la nouvelle zone";
          relocateValidationError.classList.remove("hidden");
          AudioFeedback.playError();
          triggerCardFlash();
          focusManualField(manualZoneInput);
          return;
        }

        manualZoneInput.classList.remove("border-red-500");
        relocateValidationError.textContent = "";
        relocateValidationError.classList.add("hidden");
        state.isBusy = true;
        validateRelocateBtn.disabled = true;
        renderStatusBusy();

        try {
          const payload = {
            zone: newZoneValue,
            last_updated_at: new Date().toISOString()
          };

          const query =
            state.matchedBy === "sku" && cleanActiveSku
              ? supabaseClient.from("warehouse_zoning").update(payload).eq("sku", state.activeSku.trim()).select()
              : supabaseClient.from("warehouse_zoning").update(payload).eq("barcode", cleanActiveBarcode).select();

          const { data: updatedRows, error } = await query;

          if (error || !updatedRows || updatedRows.length === 0) {
            const msg = error?.message || "Aucune ligne mise à jour (RLS)";
            renderStatusError(msg);
            relocateValidationError.textContent = `Erreur: ${msg}`;
            relocateValidationError.classList.remove("hidden");
            AudioFeedback.playError();
            triggerCardFlash();
            return;
          }

          renderStatusReady();

          // Reset to State 1 (Lookup Mode), clear all visible inputs & refocus USB input
          state.mode = MODE.LOOKUP;
          state.matchedBy = "barcode";
          state.activeBarcode = "";
          state.activeSku = "";
          state.activeZone = "";
          state.lastScanCode = "";
          state.lastScanAt = 0;
          clearAllVisibleInputs();
          barcodeInput.placeholder = "SKU ou code-barres...";

          hideAllResultStates();
          mainCard.className = "relative bg-white border border-gray-200 rounded-2xl shadow-sm p-6 sm:p-8 flex flex-col transition-colors duration-200";
          relocatedMessageEl.textContent = `Déplacé vers ${newZoneValue}`;
          stateRelocated.classList.remove("hidden");
          countdownBar.className = "h-full bg-green-500";

          AudioFeedback.playSuccess();
          triggerScreenGreenFlash();
          triggerCardFlash();
          focusScannerInput(true);
          scheduleAutoClear();
        } catch (err) {
          console.error("Erreur mise à jour Supabase:", err);
          renderStatusError(err?.message);
          relocateValidationError.textContent = "Erreur réseau — réessayez";
          relocateValidationError.classList.remove("hidden");
          AudioFeedback.playError();
          triggerCardFlash();
        } finally {
          state.isBusy = false;
          validateRelocateBtn.disabled = false;
          if (state.mode === MODE.LOOKUP && !state.isCameraActive) {
            focusScannerInput(true);
          }
        }
      }

      function enterCreateMode() {

      async function handleState3Create() {
        const cleanUnknownBarcode = sanitizeBarcode(state.unknownBarcode);
        if (!supabaseClient || !cleanUnknownBarcode) {
          resetToIdleState(true);
          return;
        }
        if (state.isBusy) return;

        const skuInputValue = newSkuInput.value.replace(/[\r\n]+/g, "").trim().toUpperCase();
        const newZoneValue = newZoneInput.value.replace(/[\r\n]+/g, "").trim().toUpperCase();

        if (!skuInputValue) {

        if (!newZoneValue) {

        newSkuInput.classList.remove("border-red-500");

        state.isBusy = true;
        createArticleBtn.disabled = true;

        try {
          const { error } = await supabaseClient
            .from("warehouse_zoning")
            .insert({
              barcode: cleanUnknownBarcode,
              sku: skuInputValue,
              zone: newZoneValue
            });

          if (error) {
            const msg = error.message || "Erreur lors de la création";
            renderStatusError(msg);
            createValidationError.textContent = msg;
            createValidationError.classList.remove("hidden");
            AudioFeedback.playError();
            triggerCardFlash();
            return;
          }

          renderStatusReady();

          // Return to State 1 (Lookup Mode), clear all visible inputs & refocus USB input
          state.mode = MODE.LOOKUP;
          state.matchedBy = "barcode";
          state.activeBarcode = "";
          state.activeSku = "";
          state.activeZone = "";
          state.unknownBarcode = "";
          state.lastScanCode = "";
          state.lastScanAt = 0;
          clearAllVisibleInputs();
          barcodeInput.placeholder = "SKU ou code-barres...";

          hideAllResultStates();
          mainCard.className = "relative bg-white border border-gray-200 rounded-2xl shadow-sm p-6 sm:p-8 flex flex-col transition-colors duration-200";
          relocatedMessageEl.textContent = `Créé avec succès dans ${newZoneValue}`;
          stateRelocated.classList.remove("hidden");
          countdownBar.className = "h-full bg-green-500";

          AudioFeedback.playSuccess();
          triggerScreenGreenFlash();
          triggerCardFlash();
          focusScannerInput(true);
          scheduleAutoClear();
        } catch (err) {
          console.error("Erreur insertion Supabase:", err);
          const msg = err?.message || "Erreur réseau — réessayez";
          renderStatusError(msg);
          createValidationError.textContent = msg;
          createValidationError.classList.remove("hidden");
          AudioFeedback.playError();
          triggerCardFlash();
        } finally {
          state.isBusy = false;
          createArticleBtn.disabled = false;
          if (state.mode === MODE.LOOKUP && !state.isCameraActive) {
            focusScannerInput(true);
          }
        }
      }

      async function handleScan(rawCode, source = "usb") {
        if (state.mode !== MODE.LOOKUP) return;
        const rawText = String(rawCode ?? "").replace(/[\r\n]+/g, "").trim();
        const cleanCode = sanitizeBarcode(rawText);
        if (!cleanCode || state.isBusy) return;

        const now = Date.now();
        const cooldown = source === "camera" ? CAMERA_DUPLICATE_COOLDOWN_MS : USB_DUPLICATE_COOLDOWN_MS;
        const dedupeKey = `${source}:${cleanCode}`;

        if (dedupeKey === state.lastScanCode && now - state.lastScanAt < cooldown) {
          if (source !== "camera") {
            barcodeInput.value = "";
            if (source === "usb" || isDesktopPointer()) {
              focusScannerInput();
            }
          }
          return;
        }

        state.lastScanCode = dedupeKey;
        state.lastScanAt = now;
        state.rapidBurstCount = 0;
        state.lastKeyTime = 0;

        if (source !== "camera") {
          barcodeInput.value = "";
        }

        await handleState1Lookup(rawText, source);
      }

      relocateBtn.addEventListener("click", () => {
        AudioFeedback.unlock();
        enterRelocationMode();
      });

      relocateForm.addEventListener("submit", (e) => {
        e.preventDefault();
        AudioFeedback.unlock();

          manualZoneInput.classList.remove("border-red-500");

      });

      cancelCreateBtn.addEventListener("click", () => {
        AudioFeedback.unlock();
        cancelCreateBtn.blur();

      });

      newSkuInput.addEventListener("pointerdown", () => {
        barcodeInput.blur();
      });

      newSkuInput.addEventListener("focus", () => {
        AudioFeedback.unlock();
        barcodeInput.blur();
      });

      newSkuInput.addEventListener("input", () => {
        if (newSkuInput.value.trim().length > 0) {
          newSkuInput.classList.remove("border-red-500");
          createValidationError.classList.add("hidden");
          createValidationError.textContent = "";

      newSkuInput.addEventListener("keydown", (e) => {

            focusManualField(newZoneInput);

          }

        barcodeInput.blur();
      });

        AudioFeedback.unlock();
        barcodeInput.blur();
      });

      newZoneInput.addEventListener("input", () => {
        if (newZoneInput.value.trim().length > 0) {
          newZoneInput.classList.remove("border-red-500");
          createValidationError.classList.add("hidden");
          createValidationError.textContent = "";
        }
      });

        if (e.key === "Enter") {
          e.preventDefault();
          AudioFeedback.unlock();
          handleState3Create();
        }
      });

      /**
       * =========================================================================
       * 6. HYBRID INPUT LISTENERS (USB Douchette + Manual SKU + Camera)
       * =========================================================================
       */
      const debouncedUsbScannerSubmit = debounce(() => {
        const rawVal = barcodeInput.value;
        barcodeInput.value = "";
        const cleanVal = sanitizeBarcode(rawVal);
        if (cleanVal.length >= 2) {
          handleScan(rawVal, "usb");
        }
      }, USB_DEBOUNCE_MS);

      barcodeInput.addEventListener("keydown", (e) => {
        AudioFeedback.unlock();

        if (e.isComposing || e.key === "Unidentified") {
          state.rapidBurstCount = 0;
          state.lastKeyTime = 0;
          return;
        }

        const now = performance.now();
        const delta = state.lastKeyTime > 0 ? now - state.lastKeyTime : 0;
        state.lastKeyTime = now;

        if (delta > 0 && delta < 35) {
          state.rapidBurstCount += 1;
        } else if (delta >= 80) {
          state.rapidBurstCount = 0;
        }

        if (e.key === "Enter") {
          e.preventDefault();
          debouncedUsbScannerSubmit.cancel();
          const rawVal = barcodeInput.value;
          barcodeInput.value = "";
          const source = state.rapidBurstCount >= 5 ? "usb" : "manual";
          handleScan(rawVal, source);
        }
      });

      barcodeInput.addEventListener("input", () => {
        const val = sanitizeBarcode(barcodeInput.value);
        if (!val) {
          debouncedUsbScannerSubmit.cancel();
          return;
        }

        if (state.rapidBurstCount >= 6) {
          debouncedUsbScannerSubmit();
        } else {
          debouncedUsbScannerSubmit.cancel();
        }
      });

      usbScanForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        AudioFeedback.unlock();
        debouncedUsbScannerSubmit.cancel();
        const rawVal = barcodeInput.value;
        barcodeInput.value = "";
        if (state.isCameraActive) {
          await stopCamera();
        }
        handleScan(rawVal, "manual");
      });

      barcodeInput.addEventListener("focus", () => {
        if (state.isCameraActive) stopCamera();
      });

      /**
       * =========================================================================
       * 7. CAMERA SCANNER (html5-qrcode — Works dynamically in State 1)
       * =========================================================================
       */
      function stopDanglingVideoTracks() {
        readerEl.querySelectorAll("video").forEach((video) => {
          const stream = video.srcObject;
          if (stream && typeof stream.getTracks === "function") {
            stream.getTracks().forEach((track) => track.stop());
          }
          video.srcObject = null;
        });
      }

      async function startCamera() {
        if (state.isCameraActive || state.isCameraBusy) return;
        state.isCameraBusy = true;
        cameraErrorEl.classList.add("hidden");
        cameraErrorEl.textContent = "";

        if (typeof Html5QrcodeScanner === "undefined") {
          cameraSection.classList.remove("hidden");
          cameraErrorEl.textContent = "Caméra indisponible.";
          cameraErrorEl.classList.remove("hidden");
          state.isCameraBusy = false;
          return;
        }

        try {
          debouncedUsbScannerSubmit.cancel();
          if (state.mode !== MODE.LOOKUP) {
            resetToIdleState(false);
          }
          barcodeInput.blur();
          manualZoneInput.blur();
          newSkuInput.blur();
          newZoneInput.blur();
          state.isCameraActive = true;
          cameraSection.classList.remove("hidden");
          updateCameraButtonUI();

          const formatsToSupport = typeof Html5QrcodeSupportedFormats !== "undefined"
            ? [
                Html5QrcodeSupportedFormats.EAN_13,
                Html5QrcodeSupportedFormats.EAN_8,
                Html5QrcodeSupportedFormats.UPC_A,
                Html5QrcodeSupportedFormats.UPC_E,
                Html5QrcodeSupportedFormats.CODE_128,
                Html5QrcodeSupportedFormats.CODE_39,
                Html5QrcodeSupportedFormats.ITF,
                Html5QrcodeSupportedFormats.QR_CODE,
                Html5QrcodeSupportedFormats.DATA_MATRIX
              ]
            : undefined;

          const config = {
            fps: 12,
            rememberLastUsedCamera: true,
            qrbox: (viewfinderWidth, viewfinderHeight) => ({
              width: Math.max(50, Math.min(320, Math.floor(viewfinderWidth * 0.85))),
              height: Math.max(50, Math.min(160, Math.floor(viewfinderHeight * 0.55)))
            }),
            ...(formatsToSupport ? { formatsToSupport } : {})
          };

          state.html5QrcodeScanner = new Html5QrcodeScanner("reader", config, /* verbose= */ false);
          state.html5QrcodeScanner.render(
            (decodedText) => handleScan(decodedText, "camera"),
            () => {}
          );

          cameraSection.scrollIntoView({ behavior: "smooth", block: "nearest" });
        } catch (err) {
          console.error("Erreur caméra:", err);
          cameraErrorEl.textContent = "Permissions caméra ou HTTPS requis.";
          cameraErrorEl.classList.remove("hidden");
          await stopCamera();
        } finally {
          state.isCameraBusy = false;
        }
      }

      async function stopCamera() {
        if (state.isCameraBusy && !state.isCameraActive) return;
        state.isCameraBusy = true;
        state.isCameraActive = false;

        try {
          if (state.html5QrcodeScanner) {
            await state.html5QrcodeScanner.clear().catch(() => {});
            state.html5QrcodeScanner = null;
          }
          stopDanglingVideoTracks();
        } finally {
          readerEl.innerHTML = "";
          cameraSection.classList.add("hidden");
          state.isCameraBusy = false;
          updateCameraButtonUI();
          focusScannerInput();
        }
      }

      cameraToggleBtn.addEventListener("click", () => {
        AudioFeedback.unlock();
        cameraToggleBtn.blur();
        if (state.isCameraActive) {
          stopCamera();
        } else {
          startCamera();
        }
      });

      document.addEventListener("click", (e) => {
        AudioFeedback.unlock();
        if (state.isCameraActive) return;
        const interactive = e.target.closest("button, input, select, a, #camera-section");
        if (!interactive) focusScannerInput();
      });

      window.addEventListener("focus", () => {
        if (!state.isCameraActive) {
          focusScannerInput();
        }
      });

      window.addEventListener("pagehide", () => {
        if (state.isCameraActive) stopCamera();
      });

      window.addEventListener("DOMContentLoaded", () => {
        if (brandLogo && brandLogo.complete && brandLogo.naturalWidth === 0) {
          brandLogo.classList.add("hidden");
          brandFallback.classList.remove("hidden");
        }
        renderStatusReady();
        focusScannerInput();
      });
    })();
  </script>
</body>
</html>
